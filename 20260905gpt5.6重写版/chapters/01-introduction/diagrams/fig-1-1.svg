<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title"><title id="title">图 1-1 三类常见工作与观察样本</title><rect width="900" height="480" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 1-1　三类常见工作与观察样本</text><rect x="26.0" y="66" width="268.0" height="334" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="40.0" y="91" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">Redis：结构化状态操作</text><text x="40.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">字符串、集合与有序集合</text><text x="40.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">按键定位并执行状态操作</text><text x="40.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="40.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">常见用途：缓存、计数、会话</text><text x="40.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">持久化与故障切换另有条件</text><rect x="316.0" y="66" width="268.0" height="334" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="330.0" y="91" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">MySQL：关系与事务</text><text x="330.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">以表、行与SQL表达关系</text><text x="330.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">用事务协调多项修改</text><text x="330.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="330.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">查询、索引与约束共同起作用</text><text x="330.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">确认范围取决于配置与故障模型</text><rect x="606.0" y="66" width="268.0" height="334" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="620.0" y="91" font-size="14" fill="#059669" text-anchor="start" font-weight="650">Kafka：事件记录与消费</text><text x="620.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">分区内追加和有序读取</text><text x="620.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">消费进度与记录保留分开</text><text x="620.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="620.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">常见用途：事件传播与重放</text><text x="620.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">业务处理仍由消费者完成</text><text x="28" y="428" font-size="12" fill="#596273" text-anchor="start" font-weight="400">三者是观察样本；能力可以组合，以上分类不覆盖全部后端基础设施。</text></g></svg>