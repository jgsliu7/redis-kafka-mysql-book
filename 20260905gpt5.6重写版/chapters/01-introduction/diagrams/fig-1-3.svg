<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title"><title id="title">图 1-3 全书主题与关联</title><rect width="900" height="480" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 1-3　全书主题与关联</text><rect x="26.0" y="66" width="268.0" height="334" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="40.0" y="91" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">第2—4章：运行基础</text><text x="40.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">第2章：结构与协议</text><text x="40.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">第3章：启动、服务与退出</text><text x="40.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">第4章：内存、磁盘与确认</text><text x="40.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="40.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">表示方式如何约束运行成本</text><rect x="316.0" y="66" width="268.0" height="334" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="330.0" y="91" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">第5—7章：责任边界</text><text x="330.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">第5章：模块与接口</text><text x="330.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">第6章：访问控制与审计</text><text x="330.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">第7章：分片、副本与拓扑</text><text x="330.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="330.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">一项责任由谁承担</text><rect x="606.0" y="66" width="268.0" height="334" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="620.0" y="91" font-size="14" fill="#059669" text-anchor="start" font-weight="650">第8—10章：恢复与组合</text><text x="620.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">第8章：字节布局与恢复</text><text x="620.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">第9章：历史、位点与续传</text><text x="620.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">第10章：库存设计推演</text><text x="620.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="620.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">把具体约束落实到系统方案</text><text x="28" y="428" font-size="12" fill="#596273" text-anchor="start" font-weight="400">第1章说明观察方法。分组用于组织阅读，不表示章节之间存在严格的依赖链。</text></g></svg>