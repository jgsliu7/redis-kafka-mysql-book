<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 515" role="img" aria-labelledby="title"><title id="title">图 9-6 共同历史、分叉尾部与重新追赶</title><rect width="900" height="515" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 9-6　共同历史、分叉尾部与重新追赶</text><rect x="28" y="180" width="238" height="114" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="42" y="205" font-size="14" fill="#059669" text-anchor="start" font-weight="650">共同前缀：offset 0—99</text><text x="42" y="233" font-size="13" fill="#374151" text-anchor="start" font-weight="400">同一分区、相容历史</text><text x="42" y="255" font-size="13" fill="#374151" text-anchor="start" font-weight="400">相应任期边界可解释</text><rect x="365" y="68" width="507" height="100" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/><text x="379" y="93" font-size="14" fill="#DC2626" text-anchor="start" font-weight="650">旧节点尾部：offset 100—109</text><text x="379" y="121" font-size="13" fill="#374151" text-anchor="start" font-weight="400">隔离期间可能存在未达到确认条件的记录</text><text x="379" y="143" font-size="13" fill="#374151" text-anchor="start" font-weight="400">数字更大或文件更长，不代表属于当前有效历史</text><rect x="365" y="300" width="507" height="100" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="379" y="325" font-size="14" fill="#059669" text-anchor="start" font-weight="650">新Leader尾部：offset 100…</text><text x="379" y="353" font-size="13" fill="#374151" text-anchor="start" font-weight="400">从其有效前缀继续追加，内容可能不同</text><text x="379" y="375" font-size="13" fill="#374151" text-anchor="start" font-weight="400">相同offset不表示同一条记录</text><path d="M269,207 L312,207" fill="none" stroke="#6B7280" stroke-width="1.5"/><path d="M312,207 L312,118" fill="none" stroke="#6B7280" stroke-width="1.5"/><path d="M312,118 L361,118" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M269,267 L312,267" fill="none" stroke="#6B7280" stroke-width="1.5"/><path d="M312,267 L312,350" fill="none" stroke="#6B7280" stroke-width="1.5"/><path d="M312,350 L361,350" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M616,174 L616,294" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><text x="633" y="219" font-size="12" fill="#374151" text-anchor="start" font-weight="400">按leader epoch确认共同前缀</text><text x="633" y="246" font-size="12" fill="#374151" text-anchor="start" font-weight="400">截断不相容尾部，再追赶</text><text x="28" y="447" font-size="12" fill="#596273" text-anchor="start" font-weight="400">图示假设共同前缀到99；实际截断边界由协议确定，不按文件长度或业务时间猜测。</text><text x="28" y="475" font-size="12" fill="#596273" text-anchor="start" font-weight="400">恢复保证仍依赖此前确认、选主与故障条件；epoch不提供跨分区业务排序。</text></g></svg>
