<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title"><title id="title">图 9-4 MySQL 接收、relay log 与应用阶段</title><rect width="900" height="480" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 9-4　MySQL 接收、relay log 与应用阶段</text><rect x="26.0" y="66" width="268.0" height="334" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="40.0" y="91" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">Source事务与等待点</text><text x="40.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">binlog包含事务事件</text><text x="40.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">AFTER_SYNC：binlog同步后</text><text x="40.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">在引擎提交前等待ACK</text><text x="40.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="40.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">AFTER_COMMIT：引擎提交后</text><text x="40.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">再等待相应ACK</text><rect x="316.0" y="66" width="268.0" height="334" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="330.0" y="91" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">Replica接收与确认</text><text x="330.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">接收线程取得事件</text><text x="330.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">写入relay log</text><text x="330.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">半同步要求相应事件刷盘</text><text x="330.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">之后可发ACK</text><text x="330.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="330.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">ACK不等待表中应用完成</text><rect x="606.0" y="66" width="268.0" height="334" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="620.0" y="91" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">Replica应用与历史身份</text><text x="620.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">应用线程/worker回放事件</text><text x="620.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">GTID标识事务；集合记录执行历史</text><text x="620.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="620.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">多来源GTID没有全局大小顺序</text><text x="620.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">知道缺失身份不代表日志仍在</text><text x="620.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">超时降级会改变确认条件</text><text x="28" y="428" font-size="12" fill="#596273" text-anchor="start" font-weight="400">接收、刷盘、应用和对外可见是不同阶段；半同步仍需合适的故障切换候选。</text></g></svg>
