<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 488" role="img" aria-labelledby="title"><title id="title">图 9-1 相同历史与确定效果的复制</title><rect width="900" height="488" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 9-1　相同历史与确定效果的复制</text><rect x="128" y="62" width="644" height="72" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="142" y="87" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">建立共同起点</text><text x="142" y="115" font-size="13" fill="#374151" text-anchor="start" font-weight="400">相同初始状态及相容的结构、版本和约束</text><path d="M450,135 L450,151" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="128" y="154" width="644" height="72" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="142" y="179" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">传播能够确定状态变化的内容</text><text x="142" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">把必要的随机选择、时间值或具体行变化明确下来</text><path d="M450,227 L450,243" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="128" y="246" width="644" height="72" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="142" y="271" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">遵守相容的应用顺序与依赖</text><text x="142" y="299" font-size="13" fill="#374151" text-anchor="start" font-weight="400">重复、缺失和错误不能靠输入名称相同自动消除</text><path d="M450,319 L450,335" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="128" y="338" width="644" height="72" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="142" y="363" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">在上述条件下得到相同结果</text><text x="142" y="391" font-size="13" fill="#374151" text-anchor="start" font-weight="400">不据此承诺网络延迟有上界或任何负载下都能及时追平</text><text x="28" y="453" font-size="12" fill="#596273" text-anchor="start" font-weight="400">Redis、MySQL与Kafka不是彼此的数据副本；本图描述复制同一状态时的必要条件。</text></g></svg>
