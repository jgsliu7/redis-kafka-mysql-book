<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title"><title id="title">图 4-1 一次读取中的缓存与持久存储</title><rect width="900" height="480" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 4-1　一次读取中的缓存与持久存储</text><rect x="26.0" y="66" width="268.0" height="334" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="40.0" y="91" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">CPU缓存</text><text x="40.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">缓存命中时读取缓存行</text><text x="40.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">未命中时需要下一级供数</text><text x="40.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="40.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">操作对象是处理器所需的数据</text><text x="40.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">通常不提供断电持久性</text><rect x="316.0" y="66" width="268.0" height="334" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="330.0" y="91" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">DRAM与软件缓存</text><text x="330.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">数据库缓冲池或OS页缓存</text><text x="330.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">命中可减少设备读取</text><text x="330.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">未命中时按文件与页定位</text><text x="330.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="330.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">缓存驻留不等于已持久化</text><rect x="606.0" y="66" width="268.0" height="334" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="620.0" y="91" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">持久存储设备</text><text x="620.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">设备处理读取与写入请求</text><text x="620.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">介质、并发和请求大小影响耗时</text><text x="620.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="620.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">页读入内存后才供上层访问</text><text x="620.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">写入确认还涉及缓存与同步</text><text x="28" y="428" font-size="12" fill="#596273" text-anchor="start" font-weight="400">延迟比较须保持操作类型、块大小和并发口径一致；不把硬件量级当成应用延迟。</text></g></svg>