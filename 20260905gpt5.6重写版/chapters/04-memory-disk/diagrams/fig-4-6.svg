<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title"><title id="title">图 4-6 Kafka文件发送与用户态中转</title><rect width="900" height="480" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 4-6　Kafka文件发送与用户态中转</text><rect x="26.0" y="66" width="268.0" height="334" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="40.0" y="91" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">普通read / write路径</text><text x="40.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">文件或页缓存</text><text x="40.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">↓</text><text x="40.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">用户态数据缓冲</text><text x="40.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">↓</text><text x="40.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">socket发送路径</text><text x="40.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="40.0" y="251" font-size="13" fill="#374151" text-anchor="start" font-weight="400">应用需要处理中转的数据</text><rect x="316.0" y="66" width="268.0" height="334" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="330.0" y="91" font-size="14" fill="#059669" text-anchor="start" font-weight="650">适用的sendfile路径</text><text x="330.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">文件或页缓存</text><text x="330.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">↓</text><text x="330.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">内核中的文件发送能力</text><text x="330.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">↓</text><text x="330.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">网络发送</text><text x="330.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="330.0" y="251" font-size="13" fill="#374151" text-anchor="start" font-weight="400">减少用户态数据中转</text><rect x="606.0" y="66" width="268.0" height="334" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="620.0" y="91" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">适用条件</text><text x="620.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">冷数据仍需设备读取</text><text x="620.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">CPU仍参与调用和协议处理</text><text x="620.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="620.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">TLS、格式转换及平台实现</text><text x="620.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">都可能改变实际路径</text><text x="620.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="620.0" y="251" font-size="13" fill="#374151" text-anchor="start" font-weight="400">不固定承诺复制或切换次数</text><text x="28" y="428" font-size="12" fill="#596273" text-anchor="start" font-weight="400">Kafka 3.9.0使用的发送路径受连接和数据格式影响；页缓存命中不是sendfile成立的必要条件。</text></g></svg>