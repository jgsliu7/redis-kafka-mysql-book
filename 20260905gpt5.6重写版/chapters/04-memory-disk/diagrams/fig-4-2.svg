<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title"><title id="title">图 4-2 Redis近似LRU与带衰减的LFU</title><rect width="900" height="480" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 4-2　Redis近似LRU与带衰减的LFU</text><rect x="26.0" y="66" width="268.0" height="334" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="40.0" y="91" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">近似LRU</text><text x="40.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">从键空间采样候选</text><text x="40.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">结合候选集合比较空闲时间</text><text x="40.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">选择更久未使用的候选淘汰</text><text x="40.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="40.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">采样规模影响成本与近似程度</text><text x="40.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">不是维护全局精确LRU链表</text><rect x="316.0" y="66" width="268.0" height="334" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="330.0" y="91" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">LFU</text><text x="330.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">以有限位宽记录近似频率</text><text x="330.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">访问时按概率递增</text><text x="330.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">结合时间衰减旧频率</text><text x="330.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="330.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">频率与衰减共同影响候选</text><text x="330.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">不是访问次数的精确总和</text><rect x="606.0" y="66" width="268.0" height="334" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="620.0" y="91" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">共同限制</text><text x="620.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">只对当前可淘汰键集合选择</text><text x="620.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">策略范围由maxmemory-policy决定</text><text x="620.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="620.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">热点转移、扫描和采样会影响结果</text><text x="620.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">不存在热键永不淘汰的保证</text><text x="620.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">maxmemory也不覆盖全部内存开销</text><text x="28" y="428" font-size="12" fill="#596273" text-anchor="start" font-weight="400">图示淘汰判断；释放对象、后台释放和请求延迟仍需分别分析。</text></g></svg>