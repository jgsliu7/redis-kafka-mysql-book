<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title"><title id="title">图 7-2 Redis Cluster 槽映射与重定向</title><rect width="900" height="480" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 7-2　Redis Cluster 槽映射与重定向</text><rect x="26.0" y="66" width="268.0" height="334" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="40.0" y="91" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">路由背景</text><text x="40.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">16384个槽映射到主节点</text><text x="40.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">通常以CRC16计算槽号</text><text x="40.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">有效hash tag会改变参与计算的字节</text><text x="40.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="40.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">示例：槽8000从B迁移到A</text><rect x="316.0" y="66" width="268.0" height="334" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="330.0" y="91" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">ASK：迁移中临时重定向</text><text x="330.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">B仍负责槽8000</text><text x="330.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">目标键在B中不存在且槽在迁出</text><text x="330.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">B返回ASK指向A</text><text x="330.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="330.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">客户端在A先发ASKING</text><text x="330.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">再发送本次命令</text><text x="330.0" y="251" font-size="13" fill="#374151" text-anchor="start" font-weight="400">不据此永久替换槽映射</text><rect x="606.0" y="66" width="268.0" height="334" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="620.0" y="91" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">MOVED：更新路由认识</text><text x="620.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">槽所属关系已变化</text><text x="620.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">收到请求的节点返回MOVED</text><text x="620.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">客户端更新相应槽映射</text><text x="620.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="620.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">后续请求改发当前负责节点</text><text x="620.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">拓扑仍可能继续变化</text><text x="28" y="428" font-size="12" fill="#596273" text-anchor="start" font-weight="400">图示单键迁移路径；多键请求与迁移中状态还可能受到额外约束。</text></g></svg>