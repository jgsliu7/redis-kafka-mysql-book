<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title"><title id="title">图 2-3 渐进式rehash的双表迁移</title><rect width="900" height="470" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 2-3　渐进式rehash的双表迁移</text><text x="50" y="78" font-size="15" fill="#4F46E5" text-anchor="start" font-weight="650">旧表：size=4，桶2待迁移</text><rect x="50" y="98" width="252" height="55" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="64" y="123" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">桶0：已搬空</text><rect x="50" y="164" width="252" height="55" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="64" y="189" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">桶1：已搬空</text><rect x="50" y="230" width="252" height="55" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="64" y="255" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">桶2：k7 → k3 → k9</text><rect x="50" y="296" width="252" height="55" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="64" y="321" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">桶3：k2 → k5</text><text x="471" y="78" font-size="15" fill="#059669" text-anchor="start" font-weight="650">新表：size=8，本次迁移后的目标</text><rect x="470" y="98" width="192" height="55" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="484" y="123" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">桶0：先前迁入的键</text><rect x="470" y="164" width="192" height="55" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="484" y="189" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">桶1：先前迁入的键</text><rect x="470" y="230" width="192" height="55" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="484" y="255" font-size="14" fill="#059669" text-anchor="start" font-weight="650">桶2：k7</text><rect x="470" y="296" width="192" height="55" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="484" y="321" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">桶3</text><rect x="680" y="98" width="192" height="55" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="694" y="123" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">桶4：先前迁入的键</text><rect x="680" y="164" width="192" height="55" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="694" y="189" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">桶5：先前迁入的键</text><rect x="680" y="230" width="192" height="55" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="694" y="255" font-size="14" fill="#059669" text-anchor="start" font-weight="650">桶6：k3 → k9</text><rect x="680" y="296" width="192" height="55" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="694" y="321" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">桶7</text><path d="M305,256 L466,256" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M340,256 L340,371" fill="none" stroke="#6B7280" stroke-width="1.5"/><path d="M340,371 L885,371" fill="none" stroke="#6B7280" stroke-width="1.5"/><path d="M885,371 L885,256" fill="none" stroke="#6B7280" stroke-width="1.5"/><path d="M885,256 L876,256" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><text x="28" y="406" font-size="12" fill="#596273" text-anchor="start" font-weight="400">新桶下标以新的表大小计算；图中键名不表示哈希值。旧桶2的键只能分布到新桶2或6。</text><text x="28" y="430" font-size="12" fill="#596273" text-anchor="start" font-weight="400">查找/删除在迁移期处理新旧表；新键进入新表。分步迁移不保证单次无停顿。</text></g>