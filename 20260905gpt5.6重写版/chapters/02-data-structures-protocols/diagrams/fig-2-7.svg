<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title"><title id="title">图 2-7 Kafka RecordBatch V2布局</title><rect width="900" height="500" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 2-7　Kafka RecordBatch V2布局</text><rect x="28" y="68" width="162" height="73" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="38" y="93" font-size="11.5" fill="#059669" text-anchor="start" font-weight="650">baseOffset</text><text x="38" y="121" font-size="12" fill="#374151" text-anchor="start" font-weight="400">8B · 字节0—7</text><rect x="200" y="68" width="162" height="73" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="210" y="93" font-size="11.5" fill="#059669" text-anchor="start" font-weight="650">batchLength</text><text x="210" y="121" font-size="12" fill="#374151" text-anchor="start" font-weight="400">4B · 字节8—11</text><rect x="372" y="68" width="162" height="73" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="382" y="93" font-size="11.5" fill="#059669" text-anchor="start" font-weight="650">partitionLeaderEpoch</text><text x="382" y="121" font-size="12" fill="#374151" text-anchor="start" font-weight="400">4B · 字节12—15</text><rect x="544" y="68" width="162" height="73" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="554" y="93" font-size="11.5" fill="#059669" text-anchor="start" font-weight="650">magic</text><text x="554" y="121" font-size="12" fill="#374151" text-anchor="start" font-weight="400">1B · 字节16—16</text><rect x="716" y="68" width="162" height="73" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="726" y="93" font-size="11.5" fill="#059669" text-anchor="start" font-weight="650">CRC</text><text x="726" y="121" font-size="12" fill="#374151" text-anchor="start" font-weight="400">4B · 字节17—20</text><rect x="28" y="152" width="162" height="73" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="38" y="177" font-size="11.5" fill="#059669" text-anchor="start" font-weight="650">attributes</text><text x="38" y="205" font-size="12" fill="#374151" text-anchor="start" font-weight="400">2B · 字节21—22</text><rect x="200" y="152" width="162" height="73" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="210" y="177" font-size="11.5" fill="#059669" text-anchor="start" font-weight="650">lastOffsetDelta</text><text x="210" y="205" font-size="12" fill="#374151" text-anchor="start" font-weight="400">4B · 字节23—26</text><rect x="372" y="152" width="162" height="73" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="382" y="177" font-size="11.5" fill="#059669" text-anchor="start" font-weight="650">baseTimestamp</text><text x="382" y="205" font-size="12" fill="#374151" text-anchor="start" font-weight="400">8B · 字节27—34</text><rect x="544" y="152" width="162" height="73" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="554" y="177" font-size="11.5" fill="#059669" text-anchor="start" font-weight="650">maxTimestamp</text><text x="554" y="205" font-size="12" fill="#374151" text-anchor="start" font-weight="400">8B · 字节35—42</text><rect x="716" y="152" width="162" height="73" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="726" y="177" font-size="11.5" fill="#059669" text-anchor="start" font-weight="650">producerId</text><text x="726" y="205" font-size="12" fill="#374151" text-anchor="start" font-weight="400">8B · 字节43—50</text><rect x="28" y="236" width="162" height="73" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="38" y="261" font-size="11.5" fill="#059669" text-anchor="start" font-weight="650">producerEpoch</text><text x="38" y="289" font-size="12" fill="#374151" text-anchor="start" font-weight="400">2B · 字节51—52</text><rect x="200" y="236" width="162" height="73" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="210" y="261" font-size="11.5" fill="#059669" text-anchor="start" font-weight="650">baseSequence</text><text x="210" y="289" font-size="12" fill="#374151" text-anchor="start" font-weight="400">4B · 字节53—56</text><rect x="372" y="236" width="162" height="73" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="382" y="261" font-size="11.5" fill="#059669" text-anchor="start" font-weight="650">recordsCount</text><text x="382" y="289" font-size="12" fill="#374151" text-anchor="start" font-weight="400">4B · 字节57—60</text><rect x="28" y="335" width="844" height="70" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="42" y="360" font-size="14" fill="#059669" text-anchor="start" font-weight="650">records：Record 1 … Record N</text><text x="42" y="388" font-size="13" fill="#374151" text-anchor="start" font-weight="400">length、时间戳差、offset差、键、值与headers等记录内容；记录体可批量压缩</text><text x="28" y="435" font-size="12" fill="#596273" text-anchor="start" font-weight="400">固定部分共61字节。batchLength不包含最前12字节；CRC从attributes开始，覆盖其后批次内容。</text><text x="28" y="459" font-size="12" fill="#596273" text-anchor="start" font-weight="400">baseTimestamp为批次基准时间戳，不要求是最小值；消费者API仍可以逐条暴露记录。</text></g></svg>