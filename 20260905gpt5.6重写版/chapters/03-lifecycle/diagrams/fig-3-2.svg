<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 488" role="img" aria-labelledby="title"><title id="title">图 3-2 Redis从配置到业务就绪</title><rect width="900" height="488" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 3-2　Redis从配置到业务就绪</text><rect x="128" y="62" width="644" height="72" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="142" y="87" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">配置生效</text><text x="142" y="115" font-size="13" fill="#374151" text-anchor="start" font-weight="400">默认值、配置文件与命令行共同确定本次运行参数</text><path d="M450,135 L450,151" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="128" y="154" width="644" height="72" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="142" y="179" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">基础设施建立</text><text x="142" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">创建数据库、事件循环和监听等资源；此时未必已可处理业务</text><path d="M450,227 L450,243" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="128" y="246" width="644" height="72" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="142" y="271" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">按持久化配置恢复</text><text x="142" y="299" font-size="13" fill="#374151" text-anchor="start" font-weight="400">启用AOF时按清单恢复base与增量；否则按配置加载RDB</text><path d="M450,319 L450,335" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="128" y="338" width="644" height="72" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="142" y="363" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">加载完成并进入服务</text><text x="142" y="391" font-size="13" fill="#374151" text-anchor="start" font-weight="400">AOF的base可为RDB或AOF；不能按文件新旧自行猜测恢复顺序</text><text x="28" y="453" font-size="12" fill="#596273" text-anchor="start" font-weight="400">依赖顺序避免使用未准备的状态；默认初始化不保证运行期不会出现配置或内存问题。</text></g></svg>