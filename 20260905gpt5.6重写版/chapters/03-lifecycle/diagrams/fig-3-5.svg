<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" role="img" aria-labelledby="title"><title id="title">图 3-5 Kafka请求处理的放行与退出条件</title><rect width="900" height="610" fill="#FFFFFF"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="failure" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#EF4444"/></marker></defs>
<text x="26" y="32" font-size="18" fill="#111827" font-weight="700">图 3-5　Kafka请求处理的放行与退出条件</text>
<!-- 准备条件并列，不规定二者固定先后。 -->
<rect x="45" y="68" width="350" height="78" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
<rect x="505" y="68" width="350" height="78" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
<rect x="265" y="196" width="370" height="80" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
<rect x="265" y="336" width="370" height="86" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
<text x="65" y="96" font-size="15" fill="#059669" font-weight="700">监听与网络资源准备</text>
<text x="525" y="96" font-size="15" fill="#059669" font-weight="700">请求所需依赖就绪</text>
<text x="285" y="224" font-size="15" fill="#059669" font-weight="700">按条件放行请求</text>
<text x="285" y="364" font-size="15" fill="#059669" font-weight="700">正常退出协调</text>
<text x="65" y="124" font-size="13" fill="#374151">入口存在，不等于请求已经可以执行</text>
<text x="525" y="124" font-size="13" fill="#374151">认证条件与相关管理器满足要求</text>
<text x="285" y="251" font-size="13" fill="#374151">运行期间限制接收，处理队列与连接压力</text>
<text x="285" y="391" font-size="13" fill="#374151">停止新请求，协调在途工作与各管理器</text>
<path d="M220 147 V172 H380 V193" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M680 147 V172 H520 V193" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M450 277 V332" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="465" y="310" font-size="12" fill="#374151">进入关闭路径</text>
<!-- 运行中异常与退出超时均可进入后续恢复。 -->
<rect x="55" y="490" width="340" height="70" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/>
<rect x="505" y="490" width="350" height="70" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.3"/>
<text x="75" y="518" font-size="15" fill="#374151" font-weight="700">完成所需清理与状态保存</text>
<text x="75" y="544" font-size="13" fill="#374151">按正常关闭路径结束</text>
<text x="525" y="518" font-size="15" fill="#B91C1C" font-weight="700">未完成结果进入后续处理</text>
<text x="525" y="544" font-size="13" fill="#374151">恢复、结果查询或重试，取决于既定协议</text>
<path d="M370 423 V458 H225 V487" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M550 423 V458 H680 V487" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#failure)"/>
<text x="563" y="450" font-size="12" fill="#B91C1C">期限耗尽</text>
<path d="M636 236 H820 V486" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#failure)"/>
<text x="699" y="293" font-size="12" fill="#B91C1C">运行中异常终止</text>
<text x="28" y="593" font-size="12" fill="#596273">箭头表示放行与退出的条件关系，不是各版本与部署固定的函数调用顺序。</text>
</svg>
