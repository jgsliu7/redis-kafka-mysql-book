<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title"><title id="title">图 3-6 KRaft Broker受控关闭与突然失联</title><rect width="900" height="480" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 3-6　KRaft Broker受控关闭与突然失联</text><rect x="26.0" y="66" width="413.0" height="334" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="40.0" y="91" font-size="14" fill="#059669" text-anchor="start" font-weight="650">Kafka 3.9.0受控关闭</text><text x="40.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">进入待受控关闭状态</text><text x="40.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">心跳携带WantShutDown</text><text x="40.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">Controller协调角色</text><text x="40.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">心跳响应shouldShutDown等状态</text><text x="40.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">Broker继续本地关闭</text><text x="40.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="40.0" y="251" font-size="13" fill="#374151" text-anchor="start" font-weight="400">协调可能等待、失败或被期限打断</text><rect x="461.0" y="66" width="413.0" height="334" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="475.0" y="91" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">突然失联</text><text x="475.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">没有完成提前协调</text><text x="475.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">控制面按故障检测判断Broker</text><text x="475.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">按当前副本条件选择接替角色</text><text x="475.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">客户端刷新元数据并重试</text><text x="475.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="475.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">恢复范围取决于有效副本历史</text><text x="475.0" y="251" font-size="13" fill="#374151" text-anchor="start" font-weight="400">不能保证没有业务抖动</text><text x="28" y="428" font-size="12" fill="#596273" text-anchor="start" font-weight="400">两条路径均需合适接替者；KRaft心跳状态不能替换成ZooKeeper模式固定RPC时序。</text></g></svg>