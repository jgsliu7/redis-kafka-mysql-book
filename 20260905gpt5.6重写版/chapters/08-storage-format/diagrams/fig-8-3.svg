<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title"><title id="title">图 8-3 InnoDB 索引页中的记录与页目录</title><rect width="900" height="600" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 8-3　InnoDB 索引页中的记录与页目录</text><rect x="28" y="64" width="472" height="66" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="42" y="86" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">FIL Header</text><text x="42" y="107" font-size="12" fill="#374151" text-anchor="start" font-weight="400">页号、类型、LSN及页间关联</text><rect x="28" y="130" width="472" height="60" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="42" y="152" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">Page Header</text><text x="42" y="173" font-size="12" fill="#374151" text-anchor="start" font-weight="400">页内记录与空间状态</text><rect x="28" y="190" width="472" height="52" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="42" y="212" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">边界记录</text><text x="42" y="233" font-size="12" fill="#374151" text-anchor="start" font-weight="400">Infimum / Supremum</text><rect x="28" y="242" width="472" height="86" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="42" y="264" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">User Records</text><text x="42" y="285" font-size="12" fill="#374151" text-anchor="start" font-weight="400">变长记录：10 → 20 → 30 → 40 → 50 → 60</text><rect x="28" y="328" width="472" height="58" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="42" y="350" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">Free Space</text><text x="42" y="371" font-size="12" fill="#374151" text-anchor="start" font-weight="400">可用于增长、插入与页内整理</text><rect x="28" y="386" width="472" height="66" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="42" y="408" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">Page Directory</text><text x="42" y="429" font-size="12" fill="#374151" text-anchor="start" font-weight="400">稀疏槽指向记录组边界</text><rect x="28" y="452" width="472" height="52" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="42" y="474" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">FIL Trailer</text><text x="42" y="495" font-size="12" fill="#374151" text-anchor="start" font-weight="400">校验等页尾信息</text><rect x="576" y="104" width="296" height="94" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="590" y="129" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">默认页大小16KiB</text><text x="590" y="157" font-size="13" fill="#374151" text-anchor="start" font-weight="400">固定的是页单位</text><text x="590" y="179" font-size="13" fill="#374151" text-anchor="start" font-weight="400">不是每行的字节长度</text><rect x="576" y="238" width="296" height="107" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="590" y="263" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">页内查找</text><text x="590" y="291" font-size="13" fill="#374151" text-anchor="start" font-weight="400">先在目录槽中缩小范围</text><text x="590" y="313" font-size="13" fill="#374151" text-anchor="start" font-weight="400">再沿记录连接作局部比较</text><rect x="576" y="385" width="296" height="110" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="590" y="410" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">页外定位与内容</text><text x="590" y="438" font-size="13" fill="#374151" text-anchor="start" font-weight="400">页号须结合所属文件解释</text><text x="590" y="460" font-size="13" fill="#374151" text-anchor="start" font-weight="400">长字段可能通过引用访问页外</text><text x="590" y="482" font-size="13" fill="#374151" text-anchor="start" font-weight="400">具体条件受行格式影响</text><path d="M502,452 L538,452" fill="none" stroke="#6B7280" stroke-width="1.5"/><path d="M538,452 L538,295" fill="none" stroke="#6B7280" stroke-width="1.5"/><path d="M538,295 L503,295" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><text x="544" y="367" font-size="11" fill="#374151" text-anchor="start" font-weight="400">定位</text><text x="28" y="555" font-size="12" fill="#596273" text-anchor="start" font-weight="400">记录字节位置不必与键序连续一致；这里的数字只是逻辑顺序示例，省略真实槽管理与记录头细节。</text></g></svg>
