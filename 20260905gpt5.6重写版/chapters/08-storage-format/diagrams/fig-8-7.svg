<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 378" role="img" aria-labelledby="title"><title id="title">图 8-7 存储格式设计的检查维度</title><rect width="900" height="378" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 8-7　存储格式设计的检查维度</text><rect x="26" y="60" width="150" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="37" y="86" font-size="14" fill="#374151" text-anchor="start" font-weight="650">条件</text><rect x="176" y="60" width="330" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="187" y="86" font-size="14" fill="#374151" text-anchor="start" font-weight="650">可使用的组织方式</text><rect x="506" y="60" width="368" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="517" y="86" font-size="14" fill="#374151" text-anchor="start" font-weight="650">还需回答</text><rect x="26" y="100" width="150" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="37" y="125" font-size="13" fill="#374151" text-anchor="start" font-weight="400">定位与修改</text><rect x="176" y="100" width="330" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="187" y="125" font-size="13" fill="#374151" text-anchor="start" font-weight="400">页、树、稀疏索引或其他索引</text><rect x="506" y="100" width="368" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="517" y="125" font-size="13" fill="#374151" text-anchor="start" font-weight="400">更新粒度、空间回收和写放大是什么</text><rect x="26" y="182" width="150" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="37" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">顺序输入与重放</text><rect x="176" y="182" width="330" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="187" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">追加日志、批次与快照</text><rect x="506" y="182" width="368" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="517" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">什么历史仍在，怎样建立恢复起点</text><rect x="26" y="264" width="150" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="37" y="289" font-size="13" fill="#374151" text-anchor="start" font-weight="400">损坏与兼容</text><rect x="176" y="264" width="330" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="187" y="289" font-size="13" fill="#374151" text-anchor="start" font-weight="400">长度、类型、版本与校验</text><rect x="506" y="264" width="368" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="517" y="289" font-size="13" fill="#374151" text-anchor="start" font-weight="400">能检测到什么，能从哪里取得恢复数据</text><text x="28" y="363" font-size="12" fill="#596273" text-anchor="start" font-weight="400">页、日志和快照可以并用；访问模式约束选择，但不唯一推出一种文件格式。</text></g></svg>
