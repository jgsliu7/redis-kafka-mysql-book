<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title"><title id="title">图 8-6 Kafka 本地、远程与副本恢复路径</title><rect width="900" height="480" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 8-6　Kafka 本地、远程与副本恢复路径</text><rect x="26.0" y="66" width="268.0" height="334" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="40.0" y="91" font-size="14" fill="#059669" text-anchor="start" font-weight="650">远程段的形成</text><text x="40.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">封闭日志段按条件上传</text><text x="40.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">保存数据、索引及辅助状态</text><text x="40.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">元数据标明可用远程历史</text><text x="40.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="40.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">本地和远程保留策略分开</text><text x="40.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">删除本地不等于远程已删除</text><rect x="316.0" y="66" width="268.0" height="334" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="330.0" y="91" font-size="14" fill="#059669" text-anchor="start" font-weight="650">消费者读取远程历史</text><text x="330.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">按远程元数据定位段</text><text x="330.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">读取或缓存所需索引</text><text x="330.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">从远程读取所需记录</text><text x="330.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="330.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">索引缓存不是历史.log整段</text><text x="330.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">在本地永久重新物化</text><rect x="606.0" y="66" width="268.0" height="334" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="620.0" y="91" font-size="14" fill="#059669" text-anchor="start" font-weight="650">Follower恢复路径</text><text x="620.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">所需位置早于Leader本地起点</text><text x="620.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">进入适用的远程辅助状态恢复</text><text x="620.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">恢复leader epoch与生产者快照</text><text x="620.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">衔接后续本地日志获取</text><text x="620.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="620.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">不要求把全部远程历史复制回来</text><text x="620.0" y="251" font-size="13" fill="#374151" text-anchor="start" font-weight="400">也不保证任意故障都可恢复</text><text x="28" y="428" font-size="12" fill="#596273" text-anchor="start" font-weight="400">前提：已启用远程存储，所需段、元数据与辅助状态存在且可访问；读取与恢复不是同一流程。</text></g></svg>
