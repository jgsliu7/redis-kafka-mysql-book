<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 605" role="img" aria-labelledby="title"><title id="title">图 8-5 RecordBatch 与稀疏索引的协作</title><rect width="900" height="605" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 8-5　RecordBatch 与稀疏索引的协作</text><rect x="28" y="66" width="236" height="86" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="42" y="91" font-size="14" fill="#059669" text-anchor="start" font-weight="650">按时间查询</text><text x="42" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">timeindex先提供附近offset</text><rect x="328" y="66" width="236" height="86" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="342" y="91" font-size="14" fill="#059669" text-anchor="start" font-weight="650">按offset查询</text><text x="342" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">示例：目标相对offset=135</text><path d="M267,109 L324,109" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="328" y="196" width="236" height="158" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="342" y="221" font-size="14" fill="#059669" text-anchor="start" font-weight="650">稀疏offset索引</text><text x="342" y="249" font-size="13" fill="#374151" text-anchor="start" font-weight="400">相对offset → 文件位置</text><text x="342" y="271" font-size="13" fill="#374151" text-anchor="start" font-weight="400">0 → 0</text><text x="342" y="293" font-size="13" fill="#374151" text-anchor="start" font-weight="400">100 → 8000</text><text x="342" y="315" font-size="13" fill="#374151" text-anchor="start" font-weight="400">200 → 16000</text><path d="M446,156 L446,192" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="638" y="196" width="234" height="158" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="652" y="221" font-size="14" fill="#059669" text-anchor="start" font-weight="650">所选日志段.log</text><text x="652" y="249" font-size="13" fill="#374151" text-anchor="start" font-weight="400">Batch：offset 0—99</text><text x="652" y="271" font-size="13" fill="#374151" text-anchor="start" font-weight="400">Batch：offset 100—149</text><text x="652" y="293" font-size="13" fill="#374151" text-anchor="start" font-weight="400">Batch：offset 150—199</text><text x="652" y="315" font-size="13" fill="#374151" text-anchor="start" font-weight="400">Batch：offset 200…</text><path d="M568,280 L634,280" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><text x="578" y="264" font-size="11" fill="#374151" text-anchor="start" font-weight="400">8000</text><rect x="250" y="409" width="622" height="93" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="264" y="434" font-size="14" fill="#059669" text-anchor="start" font-weight="650">扫描候选批，确定目标记录</text><text x="264" y="462" font-size="13" fill="#374151" text-anchor="start" font-weight="400">批头提供baseOffset等共享信息；从定位入口继续解析和扫描到目标</text><path d="M752,358 L752,405" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><text x="28" y="538" font-size="12" fill="#596273" text-anchor="start" font-weight="400">索引样例数字不代表默认间隔；条目不是每条消息一项，时间入口也不在日志扫描之后。</text><text x="28" y="565" font-size="12" fill="#596273" text-anchor="start" font-weight="400">V2批固定部分61字节；批次记录可变长并压缩。目标offset与文件字节位置不能按固定比例换算。</text></g></svg>
