<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 488" role="img" aria-labelledby="title"><title id="title">图 8-2 Redis 7.x 多部分 AOF 的生成与清单切换</title><rect width="900" height="488" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 8-2　Redis 7.x 多部分 AOF 的生成与清单切换</text><rect x="128" y="62" width="644" height="72" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="142" y="87" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">当前manifest确定恢复文件集合</text><text x="142" y="115" font-size="13" fill="#374151" text-anchor="start" font-weight="400">有效base加一个或多个incr按清单组成恢复输入</text><path d="M450,135 L450,151" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="128" y="154" width="644" height="72" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="142" y="179" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">重写期间生成新base并记录新变化</text><text x="142" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">子进程生成新的基础文件；主进程把新增传播命令写入新的incr</text><path d="M450,227 L450,243" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="128" y="246" width="644" height="72" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="142" y="271" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">基础文件完成后发布新的manifest</text><text x="142" y="299" font-size="13" fill="#374151" text-anchor="start" font-weight="400">新清单切换到新的base与所需incr组合；失败分支保留可用恢复路径</text><path d="M450,319 L450,335" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="128" y="338" width="644" height="72" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="142" y="363" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">旧文件按发布结果进入后续清理</text><text x="142" y="391" font-size="13" fill="#374151" text-anchor="start" font-weight="400">base可为RDB或AOF；不能把一次rename当成全部文件事务</text><text x="28" y="453" font-size="12" fill="#596273" text-anchor="start" font-weight="400">新版本不使用旧单文件方案中将大段增量缓冲拼回临时AOF的完整流程。</text></g></svg>
