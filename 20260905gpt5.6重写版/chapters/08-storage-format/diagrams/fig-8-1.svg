<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 475" role="img" aria-labelledby="title"><title id="title">图 8-1 RDB 文件的识别、对象编码与完整性信息</title><rect width="900" height="475" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 8-1　RDB 文件的识别、对象编码与完整性信息</text><rect x="26" y="68" width="105" height="90" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="40" y="93" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">魔数</text><text x="40" y="121" font-size="13" fill="#374151" text-anchor="start" font-weight="400">REDIS</text><rect x="131" y="68" width="105" height="90" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="145" y="93" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">版本</text><text x="145" y="121" font-size="13" fill="#374151" text-anchor="start" font-weight="400">4位ASCII</text><rect x="236" y="68" width="390" height="90" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="250" y="93" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">可变内容</text><text x="250" y="121" font-size="13" fill="#374151" text-anchor="start" font-weight="400">辅助信息 / 数据库选择 / 键值对象</text><rect x="626" y="68" width="90" height="90" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="640" y="93" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">结束</text><text x="640" y="121" font-size="13" fill="#374151" text-anchor="start" font-weight="400">EOF</text><rect x="716" y="68" width="158" height="90" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="730" y="93" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">校验</text><text x="730" y="121" font-size="13" fill="#374151" text-anchor="start" font-weight="400">CRC64</text><text x="28" y="195" font-size="14" fill="#374151" text-anchor="start" font-weight="650">对象解析示意：类型决定后续解释方式，长度按具体编码读取</text><rect x="28" y="219" width="178" height="92" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="42" y="244" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">可选对象元数据</text><text x="42" y="272" font-size="13" fill="#374151" text-anchor="start" font-weight="400">过期 / LRU / LFU</text><rect x="206" y="219" width="130" height="92" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="220" y="244" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">对象类型</text><text x="220" y="272" font-size="13" fill="#374151" text-anchor="start" font-weight="400">类型码</text><rect x="336" y="219" width="184" height="92" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="350" y="244" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">键长度与内容</text><text x="350" y="272" font-size="13" fill="#374151" text-anchor="start" font-weight="400">变长长度 + 字节</text><rect x="520" y="219" width="352" height="92" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="534" y="244" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">值表示</text><text x="534" y="272" font-size="13" fill="#374151" text-anchor="start" font-weight="400">元素、紧凑编码或其他类型内容</text><rect x="28" y="343" width="404" height="81" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="42" y="368" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">长度编码</text><text x="42" y="396" font-size="13" fill="#374151" text-anchor="start" font-weight="400">00 / 01表示短长度；10后可用32或64位</text><rect x="454" y="343" width="418" height="81" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="468" y="368" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">特殊编码</text><text x="468" y="396" font-size="13" fill="#374151" text-anchor="start" font-weight="400">11可用于整数或压缩字符串等表示</text><text x="28" y="455" font-size="12" fill="#596273" text-anchor="start" font-weight="400">文件条仅示意职责次序，不表示对象均定长；尾部校验可边解析边累计，不必先完整读两遍。</text></g></svg>
