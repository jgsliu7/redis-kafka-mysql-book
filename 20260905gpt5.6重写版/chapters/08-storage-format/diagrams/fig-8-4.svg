<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title"><title id="title">图 8-4 校验、完整页副本与 redo 的不同职责</title><rect width="900" height="480" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 8-4　校验、完整页副本与 redo 的不同职责</text><rect x="26.0" y="66" width="268.0" height="334" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="40.0" y="91" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">检测：校验与页状态</text><text x="40.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">读取页时检查校验等信息</text><text x="40.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">发现不完整或不相容的状态</text><text x="40.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="40.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">校验不是备用数据</text><text x="40.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">仅凭校验值不能恢复原内容</text><rect x="316.0" y="66" width="268.0" height="334" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="330.0" y="91" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">修复：完整页副本</text><text x="330.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">双写为适用故障提供完整页</text><text x="330.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">必要时恢复损坏的数据页</text><text x="330.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="330.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">8.0.20起使用独立双写文件</text><text x="330.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">适用范围受配置与实现限制</text><rect x="606.0" y="66" width="268.0" height="334" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="620.0" y="91" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">推进：redo恢复修改</text><text x="620.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">在可用页基础上应用必要redo</text><text x="620.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">推进到可恢复的有效状态</text><text x="620.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="620.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">WAL约束日志先于数据页持久化</text><text x="620.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">事务状态与undo另有职责</text><text x="620.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">日志块大小不保证设备原子写</text><text x="28" y="428" font-size="12" fill="#596273" text-anchor="start" font-weight="400">页完整性恢复不等于所有事务恢复已完成；双写配置不能仅凭设备宣传的原子写能力决定。</text></g></svg>
