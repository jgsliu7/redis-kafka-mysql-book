<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title"><title id="title">图 10-2 预留状态与客户端未知结果</title><rect width="900" height="430" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 10-2　预留状态与客户端未知结果</text><rect x="28" y="76" width="190" height="104" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="42" y="101" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">未处理</text><text x="42" y="129" font-size="13" fill="#374151" text-anchor="start" font-weight="400">同一次意图使用</text><text x="42" y="151" font-size="13" fill="#374151" text-anchor="start" font-weight="400">同一request_id</text><rect x="328" y="76" width="220" height="104" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="342" y="101" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">RESERVED：已预留</text><text x="342" y="129" font-size="13" fill="#374151" text-anchor="start" font-weight="400">库存不足时不进入该状态</text><rect x="328" y="244" width="220" height="100" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="342" y="269" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">REJECTED：已拒绝</text><text x="342" y="297" font-size="13" fill="#374151" text-anchor="start" font-weight="400">记录明确拒绝结果</text><rect x="656" y="64" width="216" height="104" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="670" y="89" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">CONFIRMED：已确认</text><text x="670" y="117" font-size="13" fill="#374151" text-anchor="start" font-weight="400">reserved减少</text><text x="670" y="139" font-size="13" fill="#374151" text-anchor="start" font-weight="400">sold增加</text><rect x="656" y="244" width="216" height="104" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="670" y="269" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">CANCELED：已取消</text><text x="670" y="297" font-size="13" fill="#374151" text-anchor="start" font-weight="400">reserved减少</text><text x="670" y="319" font-size="13" fill="#374151" text-anchor="start" font-weight="400">available增加</text><path d="M220,116 L324,116" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M126,182 L126,292" fill="none" stroke="#6B7280" stroke-width="1.5"/><path d="M126,292 L324,292" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M550,108 L652,108" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M550,153 L606,153" fill="none" stroke="#6B7280" stroke-width="1.5"/><path d="M606,153 L606,294" fill="none" stroke="#6B7280" stroke-width="1.5"/><path d="M606,294 L652,294" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><text x="242" y="100" font-size="12" fill="#374151" text-anchor="start" font-weight="400">事务成功</text><text x="166" y="275" font-size="12" fill="#374151" text-anchor="start" font-weight="400">库存不足等拒绝</text><text x="571" y="94" font-size="12" fill="#374151" text-anchor="start" font-weight="400">确认</text><text x="613" y="235" font-size="12" fill="#374151" text-anchor="start" font-weight="400">取消</text><text x="28" y="383" font-size="12" fill="#596273" text-anchor="start" font-weight="400">超时是客户端对结果未知，不是新的服务器失败状态。已确认与已取消之间没有直接转移。</text><text x="28" y="405" font-size="12" fill="#596273" text-anchor="start" font-weight="400">PENDING仅在创建事务内部使用，不独立提交；同一请求重试应返回持久化的既有结果。</text></g></svg>
