<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 378" role="img" aria-labelledby="title"><title id="title">图 6-2 Kafka 监听器与连接身份</title><rect width="900" height="378" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 6-2　Kafka 监听器与连接身份</text><rect x="26" y="60" width="170" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="37" y="86" font-size="14" fill="#374151" text-anchor="start" font-weight="650">连接路径</text><rect x="196" y="60" width="335" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="207" y="86" font-size="14" fill="#374151" text-anchor="start" font-weight="650">示例配置职责</text><rect x="531" y="60" width="343" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="542" y="86" font-size="14" fill="#374151" text-anchor="start" font-weight="650">需要核对的范围</text><rect x="26" y="100" width="170" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="37" y="125" font-size="13" fill="#374151" text-anchor="start" font-weight="400">应用 → Broker</text><rect x="196" y="100" width="335" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="207" y="125" font-size="13" fill="#374151" text-anchor="start" font-weight="400">INTERNAL / EXTERNAL各有地址</text><text x="207" y="147" font-size="13" fill="#374151" text-anchor="start" font-weight="400">示例采用SASL_SSL</text><rect x="531" y="100" width="343" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="542" y="125" font-size="13" fill="#374151" text-anchor="start" font-weight="400">SASL确定身份，TLS保护连接</text><text x="542" y="147" font-size="13" fill="#374151" text-anchor="start" font-weight="400">advertised地址必须可达且可校验</text><rect x="26" y="182" width="170" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="37" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">Broker → Broker</text><rect x="196" y="182" width="335" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="207" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">副本流量使用指定监听器</text><text x="207" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">单独配置认证和传输保护</text><rect x="531" y="182" width="343" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="542" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">应用连接安全不自动覆盖副本连接</text><text x="542" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">证书、身份与授权需要匹配</text><rect x="26" y="264" width="170" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="37" y="289" font-size="13" fill="#374151" text-anchor="start" font-weight="400">Broker / Controller</text><text x="37" y="311" font-size="13" fill="#374151" text-anchor="start" font-weight="400">控制面</text><rect x="196" y="264" width="335" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="207" y="289" font-size="13" fill="#374151" text-anchor="start" font-weight="400">本例选择TLS保护KRaft连接</text><text x="207" y="311" font-size="13" fill="#374151" text-anchor="start" font-weight="400">Controller配置与角色单独核对</text><rect x="531" y="264" width="343" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="542" y="289" font-size="13" fill="#374151" text-anchor="start" font-weight="400">这只是一个部署选择</text><text x="542" y="311" font-size="13" fill="#374151" text-anchor="start" font-weight="400">不据此排除其他受支持配置</text><text x="28" y="363" font-size="12" fill="#596273" text-anchor="start" font-weight="400">监听器不是信任等级排名；每段保护范围取决于部署、身份映射与实际网络路径。</text></g></svg>