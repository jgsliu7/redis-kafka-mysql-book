<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title"><title id="title">图 6-4 MySQL 权限作用域与有效授权</title><rect width="900" height="480" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 6-4　MySQL 权限作用域与有效授权</text><rect x="26.0" y="66" width="268.0" height="334" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="40.0" y="91" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">账号与已激活角色</text><text x="40.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">先确定匹配的user@host账号</text><text x="40.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">会话中已激活角色参与权限计算</text><text x="40.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="40.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">角色已授予不等于当前已激活</text><text x="40.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">连接身份也不同于客户端输入名</text><rect x="316.0" y="66" width="268.0" height="334" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="330.0" y="91" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">适用权限可来自不同范围</text><text x="330.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">全局 / 数据库 / 表 / 列</text><text x="330.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">支持的权限在适用范围合并</text><text x="330.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="330.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">例程权限属于对应对象类型</text><text x="330.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">不是列权限之后的第五级</text><text x="330.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">授权表通常由服务端缓存</text><rect x="606.0" y="66" width="268.0" height="334" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="620.0" y="91" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">限制与例外需单独说明</text><text x="620.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">不给表级权限</text><text x="620.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">不撤销已经取得的全局权限</text><text x="620.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="620.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">8.0.16起的partial_revokes</text><text x="620.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">支持特定全局权限的库级限制</text><text x="620.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">它不是通用的逐级拒绝模型</text><text x="28" y="428" font-size="12" fill="#596273" text-anchor="start" font-weight="400">授权作用域不是五道逐渐收窄的过滤器；权限类型、角色激活与例外机制共同决定结果。</text></g></svg>