<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title"><title id="title">图 9-1 数据同步的四项检查</title><rect width="900" height="460" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 9-1　数据同步的四项检查</text><rect x="26" y="60" width="130" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="37" y="86" font-size="14" fill="#374151" text-anchor="start" font-weight="650">问题</text><rect x="156" y="60" width="350" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="167" y="86" font-size="14" fill="#374151" text-anchor="start" font-weight="650">需要明确的内容</text><rect x="506" y="60" width="368" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="517" y="86" font-size="14" fill="#374151" text-anchor="start" font-weight="650">错误推导</text><rect x="26" y="100" width="130" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="37" y="125" font-size="13" fill="#374151" text-anchor="start" font-weight="400">传播内容</text><rect x="156" y="100" width="350" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="167" y="125" font-size="13" fill="#374151" text-anchor="start" font-weight="400">命令效果、行事件或日志记录</text><rect x="506" y="100" width="368" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="517" y="125" font-size="13" fill="#374151" text-anchor="start" font-weight="400">输入文本相同就一定效果相同</text><rect x="26" y="182" width="130" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="37" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">确认阶段</text><rect x="156" y="182" width="350" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="167" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">接收、写日志、刷盘、应用、可见</text><rect x="506" y="182" width="368" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="517" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">ACK等于所有节点完成全部工作</text><rect x="26" y="264" width="130" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="37" y="289" font-size="13" fill="#374151" text-anchor="start" font-weight="400">续传条件</text><rect x="156" y="264" width="350" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="167" y="289" font-size="13" fill="#374151" text-anchor="start" font-weight="400">历史身份、进度与仍可得的内容</text><rect x="506" y="264" width="368" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="517" y="289" font-size="13" fill="#374151" text-anchor="start" font-weight="400">offset相同就属于相同历史</text><rect x="26" y="346" width="130" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="37" y="371" font-size="13" fill="#374151" text-anchor="start" font-weight="400">故障处理</text><rect x="156" y="346" width="350" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="167" y="371" font-size="13" fill="#374151" text-anchor="start" font-weight="400">等待、拒绝、降级、换主或重建</text><rect x="506" y="346" width="368" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="517" y="371" font-size="13" fill="#374151" text-anchor="start" font-weight="400">超时就表示服务器没有执行</text><text x="28" y="445" font-size="12" fill="#596273" text-anchor="start" font-weight="400">复制协议、容量与故障假设共同决定行为。</text></g></svg>
