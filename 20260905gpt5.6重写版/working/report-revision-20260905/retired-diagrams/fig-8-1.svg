<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 378" role="img" aria-labelledby="title"><title id="title">图 8-1 正常访问与恢复对文件的不同要求</title><rect width="900" height="378" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 8-1　正常访问与恢复对文件的不同要求</text><rect x="26" y="60" width="125" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="37" y="86" font-size="14" fill="#374151" text-anchor="start" font-weight="650">观察样本</text><rect x="151" y="60" width="353" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="162" y="86" font-size="14" fill="#374151" text-anchor="start" font-weight="650">正常读写主要路径</text><rect x="504" y="60" width="370" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="515" y="86" font-size="14" fill="#374151" text-anchor="start" font-weight="650">恢复输入</text><rect x="26" y="100" width="125" height="82" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="37" y="125" font-size="13" fill="#374151" text-anchor="start" font-weight="400">Redis</text><rect x="151" y="100" width="353" height="82" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="162" y="125" font-size="13" fill="#374151" text-anchor="start" font-weight="400">命令访问内存数据结构</text><rect x="504" y="100" width="370" height="82" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="515" y="125" font-size="13" fill="#374151" text-anchor="start" font-weight="400">按配置由RDB或AOF重建内存</text><rect x="26" y="182" width="125" height="82" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="37" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">InnoDB</text><rect x="151" y="182" width="353" height="82" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="162" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">请求访问缓冲池中的页</text><text x="162" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">缺页时读取对应数据文件</text><rect x="504" y="182" width="370" height="82" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="515" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">数据页与redo等恢复状态配合</text><text x="515" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">不能把最新脏页视为文件中已有</text><rect x="26" y="264" width="125" height="82" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="37" y="289" font-size="13" fill="#374151" text-anchor="start" font-weight="400">Kafka</text><rect x="151" y="264" width="353" height="82" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="162" y="289" font-size="13" fill="#374151" text-anchor="start" font-weight="400">追加与读取利用OS页缓存</text><text x="162" y="311" font-size="13" fill="#374151" text-anchor="start" font-weight="400">日志段及索引组织记录</text><rect x="504" y="264" width="370" height="82" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="515" y="289" font-size="13" fill="#374151" text-anchor="start" font-weight="400">恢复日志边界与相关状态</text><text x="515" y="311" font-size="13" fill="#374151" text-anchor="start" font-weight="400">远程存储启用后还有远程来源</text><text x="28" y="363" font-size="12" fill="#596273" text-anchor="start" font-weight="400">本图不展开复制副本；框的大小不表示数据权重或唯一正本。</text></g></svg>
