<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 378" role="img" aria-labelledby="title"><title id="title">图 10-1 前文主题与库存设计的对应</title><rect width="900" height="378" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 10-1　前文主题与库存设计的对应</text><rect x="26" y="60" width="145" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="37" y="86" font-size="14" fill="#374151" text-anchor="start" font-weight="650">主题</text><rect x="171" y="60" width="703" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="182" y="86" font-size="14" fill="#374151" text-anchor="start" font-weight="650">进入本案例的决定</text><rect x="26" y="100" width="145" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="37" y="125" font-size="13" fill="#374151" text-anchor="start" font-weight="400">第1—3章</text><rect x="171" y="100" width="703" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="182" y="125" font-size="13" fill="#374151" text-anchor="start" font-weight="400">明确成功与故障条件；请求身份与数量；就绪、在途请求与退出</text><rect x="26" y="182" width="145" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="37" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">第4—6章</text><rect x="171" y="182" width="703" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="182" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">提交持久化与缓存重建；库存事务和发布职责；用户与服务账号权限</text><rect x="26" y="264" width="145" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="37" y="289" font-size="13" fill="#374151" text-anchor="start" font-weight="400">第7—9章</text><rect x="171" y="264" width="703" height="82" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="182" y="289" font-size="13" fill="#374151" text-anchor="start" font-weight="400">单写入口与候选历史；事件与恢复格式；续传、幂等和消费者结果</text><text x="28" y="363" font-size="12" fill="#596273" text-anchor="start" font-weight="400">这里只作主题索引；完整约束与九项映射见正文表10-1。</text></g></svg>
