<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 378" role="img" aria-labelledby="title"><title id="title">图 5-7 职责边界与执行边界对照</title><rect width="900" height="378" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 5-7　职责边界与执行边界对照</text><rect x="26" y="60" width="140" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="37" y="86" font-size="14" fill="#374151" text-anchor="start" font-weight="650">观察样本</text><rect x="166" y="60" width="340" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="177" y="86" font-size="14" fill="#374151" text-anchor="start" font-weight="650">职责之间怎样协作</text><rect x="506" y="60" width="368" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="517" y="86" font-size="14" fill="#374151" text-anchor="start" font-weight="650">没有被接口自动解决的事</text><rect x="26" y="100" width="140" height="82" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="37" y="125" font-size="13" fill="#374151" text-anchor="start" font-weight="400">Redis</text><rect x="166" y="100" width="340" height="82" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="177" y="125" font-size="13" fill="#374151" text-anchor="start" font-weight="400">解析 → 命令分派 → 类型操作</text><text x="177" y="147" font-size="13" fill="#374151" text-anchor="start" font-weight="400">主要命令路径可直接函数调用</text><rect x="506" y="100" width="368" height="82" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="517" y="125" font-size="13" fill="#374151" text-anchor="start" font-weight="400">表示转换、会话状态与输出积压</text><text x="517" y="147" font-size="13" fill="#374151" text-anchor="start" font-weight="400">仍需明确的所有权和生命周期</text><rect x="26" y="182" width="140" height="82" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="37" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">MySQL</text><rect x="166" y="182" width="340" height="82" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="177" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">连接与SQL处理共享上下文</text><text x="177" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">经引擎接口进入具体存储实现</text><rect x="506" y="182" width="368" height="82" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="517" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">不同引擎的能力与事务语义</text><text x="517" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">无法由同名接口完全统一</text><rect x="26" y="264" width="140" height="82" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="37" y="289" font-size="13" fill="#374151" text-anchor="start" font-weight="400">Kafka</text><rect x="166" y="264" width="340" height="82" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="177" y="289" font-size="13" fill="#374151" text-anchor="start" font-weight="400">网络线程经队列交接</text><text x="177" y="311" font-size="13" fill="#374151" text-anchor="start" font-weight="400">业务层调用日志与协调组件</text><rect x="506" y="264" width="368" height="82" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="517" y="289" font-size="13" fill="#374151" text-anchor="start" font-weight="400">进程内交接和分布式RPC不同</text><text x="517" y="311" font-size="13" fill="#374151" text-anchor="start" font-weight="400">队列、配额与角色仍会相互约束</text><text x="28" y="363" font-size="12" fill="#596273" text-anchor="start" font-weight="400">同一职责划分可以有不同执行结构；框的数量不是架构优劣指标。</text></g></svg>
