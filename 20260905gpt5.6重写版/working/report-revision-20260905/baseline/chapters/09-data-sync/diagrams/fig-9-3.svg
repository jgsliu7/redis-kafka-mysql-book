<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title"><title id="title">图 9-3 Redis 全量与部分同步的分支</title><rect width="900" height="480" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 9-3　Redis 全量与部分同步的分支</text><rect x="26.0" y="66" width="268.0" height="334" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="40.0" y="91" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">重连时先核对</text><text x="40.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">副本携带replid与复制offset</text><text x="40.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="40.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">历史身份是否可接受？</text><text x="40.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">请求位置是否在有效边界？</text><text x="40.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">所需字节是否仍然保留？</text><rect x="316.0" y="66" width="268.0" height="334" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="330.0" y="91" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">条件满足：部分同步</text><text x="330.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">主节点接受对应历史</text><text x="330.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">发送保留窗口中的缺少字节</text><text x="330.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">副本继续应用复制流</text><text x="330.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="330.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">只补差额，不重新建立全量数据</text><text x="330.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">追平仍需净处理能力</text><rect x="606.0" y="66" width="268.0" height="334" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="620.0" y="91" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">否则：建立新的基础状态</text><text x="620.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">生成并传递RDB状态</text><text x="620.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">保留生成及传输中的新增变化</text><text x="620.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">加载基础状态后继续增量</text><text x="620.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="620.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">磁盘中转与无盘路径有差异</text><text x="620.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">共享缓冲不能套成每副本一整份</text><text x="28" y="428" font-size="12" fill="#596273" text-anchor="start" font-weight="400">主节点可在有限边界内接受先前replid；并非只作当前replid字符串相等判断。</text></g></svg>