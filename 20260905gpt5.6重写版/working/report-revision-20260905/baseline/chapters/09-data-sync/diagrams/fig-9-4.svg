<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title"><title id="title">图 9-4 历史位置与可重传窗口</title><rect width="900" height="480" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 9-4　历史位置与可重传窗口</text><rect x="26.0" y="66" width="268.0" height="334" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="40.0" y="91" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">历史H：副本到位置100</text><text x="40.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">进度元数据仍然有效</text><text x="40.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">需要后续101—120的内容</text><text x="40.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="40.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">位置是本例抽象示意</text><text x="40.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">Redis真实offset按流字节解释</text><rect x="316.0" y="66" width="268.0" height="334" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="330.0" y="91" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">来源保留101—120</text><text x="330.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">身份相容且所需内容仍在</text><text x="330.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">可以尝试部分续传</text><text x="330.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="330.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">有内容不代表立即追平</text><text x="330.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">有效处理速率须超过新增速率</text><rect x="606.0" y="66" width="268.0" height="334" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="620.0" y="91" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">来源只保留111—120</text><text x="620.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">已知缺少哪一段</text><text x="620.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">却不能仅靠位点恢复101—110</text><text x="620.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="620.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">需要其他内容来源或重建基础</text><text x="620.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">不同历史J的位置120</text><text x="620.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">也不能当成H的相同内容</text><text x="28" y="428" font-size="12" fill="#596273" text-anchor="start" font-weight="400">位点元数据与可重传数据是不同对象；保留窗口预算与追赶能力预算需要分别计算。</text></g></svg>