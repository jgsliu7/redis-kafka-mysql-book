<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title"><title id="title">图 9-6 Kafka 副本进度、提交边界与读取范围</title><rect width="900" height="440" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 9-6　Kafka 副本进度、提交边界与读取范围</text><text x="28" y="82" font-size="15" fill="#059669" text-anchor="start" font-weight="650">单分区本地日志示例</text><rect x="100" y="145" width="140" height="92" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="114" y="170" font-size="14" fill="#059669" text-anchor="start" font-weight="650">offset 0</text><text x="114" y="198" font-size="13" fill="#374151" text-anchor="start" font-weight="400">本地已有记录</text><rect x="240" y="145" width="140" height="92" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="254" y="170" font-size="14" fill="#059669" text-anchor="start" font-weight="650">offset 1</text><text x="254" y="198" font-size="13" fill="#374151" text-anchor="start" font-weight="400">本地已有记录</text><rect x="380" y="145" width="140" height="92" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="394" y="170" font-size="14" fill="#059669" text-anchor="start" font-weight="650">offset 2</text><text x="394" y="198" font-size="13" fill="#374151" text-anchor="start" font-weight="400">本地已有记录</text><rect x="520" y="145" width="140" height="92" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="534" y="170" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">offset 3</text><text x="534" y="198" font-size="13" fill="#374151" text-anchor="start" font-weight="400">本地已有记录</text><rect x="660" y="145" width="140" height="92" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="674" y="170" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">offset 4</text><text x="674" y="198" font-size="13" fill="#374151" text-anchor="start" font-weight="400">本地已有记录</text><path d="M520,110 L520,273" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5 4"/><text x="520" y="99" font-size="15" fill="#DC2626" text-anchor="middle" font-weight="650">HW=3</text><path d="M800,110 L800,273" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 4"/><text x="800" y="99" font-size="15" fill="#059669" text-anchor="middle" font-weight="650">LEO=5</text><rect x="100" y="278" width="420" height="49" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="310" y="309" font-size="14" fill="#059669" text-anchor="middle" font-weight="400">HW以下：offset 0、1、2</text><rect x="520" y="278" width="280" height="49" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="660" y="309" font-size="13" fill="#374151" text-anchor="middle" font-weight="400">本地追加，尚未到达HW</text><text x="28" y="372" font-size="12" fill="#596273" text-anchor="start" font-weight="400">边界按下一个offset表示；普通非事务读取受HW限制，read_committed还受未完成事务的稳定边界限制。</text><text x="28" y="399" font-size="12" fill="#596273" text-anchor="start" font-weight="400">HW是复制协议边界，不是所有时刻的即时min(LEO)等式，也不表示每条记录已经fsync。</text></g></svg>