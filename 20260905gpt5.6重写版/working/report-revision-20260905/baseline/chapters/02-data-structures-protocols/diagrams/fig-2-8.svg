<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 408" role="img" aria-labelledby="title"><title id="title">图 2-8 三种协议的编码、批量与兼容方式</title><rect width="900" height="408" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 2-8　三种协议的编码、批量与兼容方式</text><rect x="26" y="60" width="145" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="37" y="86" font-size="14" fill="#374151" text-anchor="start" font-weight="650">观察样本</text><rect x="171" y="60" width="340" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="182" y="86" font-size="14" fill="#374151" text-anchor="start" font-weight="650">编码与交互</text><rect x="511" y="60" width="363" height="40" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="522" y="86" font-size="14" fill="#374151" text-anchor="start" font-weight="650">成本与兼容</text><rect x="26" y="100" width="145" height="92" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="37" y="125" font-size="13" fill="#374151" text-anchor="start" font-weight="400">Redis / RESP</text><rect x="171" y="100" width="340" height="92" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="182" y="125" font-size="13" fill="#374151" text-anchor="start" font-weight="400">类型前缀与长度字段</text><text x="182" y="147" font-size="13" fill="#374151" text-anchor="start" font-weight="400">字符串负载二进制安全</text><text x="182" y="169" font-size="13" fill="#374151" text-anchor="start" font-weight="400">支持请求/响应</text><rect x="511" y="100" width="363" height="92" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="522" y="125" font-size="13" fill="#374151" text-anchor="start" font-weight="400">Pipeline减少逐条等待</text><text x="522" y="147" font-size="13" fill="#374151" text-anchor="start" font-weight="400">不把多命令变成事务</text><text x="522" y="169" font-size="13" fill="#374151" text-anchor="start" font-weight="400">RESP2与RESP3有不同类型集</text><rect x="26" y="192" width="145" height="92" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="37" y="217" font-size="13" fill="#374151" text-anchor="start" font-weight="400">MySQL协议</text><rect x="171" y="192" width="340" height="92" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="182" y="217" font-size="13" fill="#374151" text-anchor="start" font-weight="400">命令与结果集都有结构</text><text x="182" y="239" font-size="13" fill="#374151" text-anchor="start" font-weight="400">文本结果与二进制结果并存</text><text x="182" y="261" font-size="13" fill="#374151" text-anchor="start" font-weight="400">支持请求/响应</text><rect x="511" y="192" width="363" height="92" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="522" y="217" font-size="13" fill="#374151" text-anchor="start" font-weight="400">预处理复用语句及参数绑定</text><text x="522" y="239" font-size="13" fill="#374151" text-anchor="start" font-weight="400">不等于多条记录合成一批</text><text x="522" y="261" font-size="13" fill="#374151" text-anchor="start" font-weight="400">握手交换能力标志</text><rect x="26" y="284" width="145" height="92" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="37" y="309" font-size="13" fill="#374151" text-anchor="start" font-weight="400">Kafka协议</text><rect x="171" y="284" width="340" height="92" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="182" y="309" font-size="13" fill="#374151" text-anchor="start" font-weight="400">各API采用二进制结构</text><text x="182" y="331" font-size="13" fill="#374151" text-anchor="start" font-weight="400">请求头标明API与版本</text><text x="182" y="353" font-size="13" fill="#374151" text-anchor="start" font-weight="400">支持请求/响应</text><rect x="511" y="284" width="363" height="92" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="522" y="309" font-size="13" fill="#374151" text-anchor="start" font-weight="400">RecordBatch摊销记录开销</text><text x="522" y="331" font-size="13" fill="#374151" text-anchor="start" font-weight="400">API版本与扩展字段支持演进</text><text x="522" y="353" font-size="13" fill="#374151" text-anchor="start" font-weight="400">消费者API仍可逐条返回记录</text><text x="28" y="393" font-size="12" fill="#596273" text-anchor="start" font-weight="400">编码方式、批量方式和交互模型是不同维度。</text></g></svg>