<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title"><title id="title">图 2-5 Redis底层结构与编码转换</title><rect width="900" height="480" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 2-5　Redis底层结构与编码转换</text><rect x="26.0" y="66" width="268.0" height="334" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="40.0" y="91" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">字符串、哈希与集合</text><text x="40.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">String：int / embstr / raw</text><text x="40.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">Hash：listpack / hashtable</text><text x="40.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">Set：intset、listpack</text><text x="40.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">或hashtable</text><text x="40.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="40.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">Set的listpack路径从7.2引入；</text><text x="40.0" y="251" font-size="13" fill="#374151" text-anchor="start" font-weight="400">数量、长度与安全大小共同约束</text><rect x="316.0" y="66" width="268.0" height="334" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="330.0" y="91" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">有序集合与列表</text><text x="330.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">ZSet：listpack 或 skiplist + dict</text><text x="330.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">跳表按分值保持顺序</text><text x="330.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="330.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">List：quicklist连接多个紧凑块</text><text x="330.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">7.x常用listpack保存块内元素</text><text x="330.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">大元素的具体节点表示另有分支</text><rect x="606.0" y="66" width="268.0" height="334" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="620.0" y="91" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">转换的责任与代价</text><text x="620.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">小对象通常优先紧凑表示</text><text x="620.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">超过条件时转为其他结构</text><text x="620.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="620.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">转换要分配、遍历与移动数据</text><text x="620.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">不同类型有不同转换规则</text><text x="620.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">Set不必逐级经过listpack</text><text x="28" y="428" font-size="12" fill="#596273" text-anchor="start" font-weight="400">图列常用路径，不覆盖每一种内部结构；类型语义与编码选择在服务端共同维护。</text></g></svg>