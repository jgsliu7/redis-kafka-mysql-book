<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title"><title id="title">图 2-6 InnoDB聚簇索引B+树示例</title><rect width="900" height="470" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 2-6　InnoDB聚簇索引B+树示例</text><rect x="330" y="66" width="240" height="90" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="344" y="91" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">根页：分隔键30与65</text><text x="344" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">键与子页定位信息</text><rect x="32" y="225" width="236" height="104" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="46" y="250" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">叶页A：键小于30</text><text x="46" y="278" font-size="13" fill="#374151" text-anchor="start" font-weight="400">5、12、20及对应行</text><rect x="332" y="225" width="236" height="104" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="346" y="250" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">叶页B：30 ≤ 键 &lt; 65</text><text x="346" y="278" font-size="13" fill="#374151" text-anchor="start" font-weight="400">30、40、60及对应行</text><rect x="632" y="225" width="236" height="104" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="646" y="250" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">叶页C：键不小于65</text><text x="646" y="278" font-size="13" fill="#374151" text-anchor="start" font-weight="400">65、80、95及对应行</text><path d="M380,159 L150,220" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M450,159 L450,220" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M520,159 L750,220" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M271,270 L328,270" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M571,270 L628,270" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><text x="28" y="372" font-size="12" fill="#596273" text-anchor="start" font-weight="400">叶层按键顺序关联，范围读取先定位起点再继续访问；图中省略反向链接。</text><text x="28" y="398" font-size="12" fill="#596273" text-anchor="start" font-weight="400">默认页大小16KiB；树可以包含更多内部层。叶页保存行数据的说明针对聚簇索引。</text><text x="28" y="424" font-size="12" fill="#596273" text-anchor="start" font-weight="400">树层数不等于固定物理I/O次数：已有缓存、预读和访问对象都会改变实际读取。</text></g></svg>