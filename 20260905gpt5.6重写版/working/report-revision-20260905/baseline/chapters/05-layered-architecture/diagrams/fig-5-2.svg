<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title"><title id="title">图 5-2 类型语义与内部编码</title><rect width="900" height="480" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 5-2　类型语义与内部编码</text><rect x="26.0" y="66" width="268.0" height="334" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="40.0" y="91" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">客户端可见类型</text><text x="40.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">字符串、列表、哈希、集合</text><text x="40.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">有序集合等类型</text><text x="40.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="40.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">类型限定可接受的命令语义</text><text x="40.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">错误类型不能任意套用其他命令</text><rect x="316.0" y="66" width="268.0" height="334" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="330.0" y="91" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">服务端类型操作</text><text x="330.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">命令处理调用类型相关操作</text><text x="330.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">检查表示、选择路径、执行转换</text><text x="330.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="330.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">新增编码要补齐相关操作</text><text x="330.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">抽象边界减少波及范围</text><text x="330.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">不保证一行命令代码也不改</text><rect x="606.0" y="66" width="268.0" height="334" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="620.0" y="91" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">具体内存表示</text><text x="620.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">字符串：int / embstr / raw</text><text x="620.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">哈希：listpack / hashtable</text><text x="620.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">有序集合：listpack / skiplist</text><text x="620.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">列表：quicklist中的紧凑块</text><text x="620.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="620.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">合法编码由类型与版本约束</text><text x="28" y="428" font-size="12" fill="#596273" text-anchor="start" font-weight="400">type与encoding不是两个互不接触的层；quicklist组织节点，listpack保存块内紧凑数据。</text></g></svg>