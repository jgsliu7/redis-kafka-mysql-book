<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title"><title id="title">图 5-6 Kafka 消费与复制共享的日志读取能力</title><rect width="900" height="480" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 5-6　Kafka 消费与复制共享的日志读取能力</text><rect x="26.0" y="66" width="268.0" height="334" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="40.0" y="91" font-size="14" fill="#059669" text-anchor="start" font-weight="650">消费者读取</text><text x="40.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">Fetch请求</text><text x="40.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">可见性受HW或事务隔离规则限制</text><text x="40.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">消费进度由消费协议维护</text><text x="40.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="40.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">远程历史读取有专门路径</text><rect x="316.0" y="66" width="268.0" height="334" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="330.0" y="91" font-size="14" fill="#059669" text-anchor="start" font-weight="650">可复用的读取工作</text><text x="330.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">定位分区与日志段</text><text x="330.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">利用索引确定附近文件位置</text><text x="330.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">读取记录批次并生成响应</text><text x="330.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="330.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">发送方式仍受TLS、格式等限制</text><rect x="606.0" y="66" width="268.0" height="334" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="620.0" y="91" font-size="14" fill="#059669" text-anchor="start" font-weight="650">Follower复制</text><text x="620.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">Fetch请求</text><text x="620.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">维护副本进度与leader epoch</text><text x="620.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">必要时截断或恢复历史</text><text x="620.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="620.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">远程层相关恢复责任</text><text x="620.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">不能归为普通消费者状态</text><text x="28" y="428" font-size="12" fill="#596273" text-anchor="start" font-weight="400">共享底层读取能力，不表示身份、可见性规则、进度状态与故障处理完全相同。</text></g></svg>