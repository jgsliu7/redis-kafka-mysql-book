<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 396" role="img" aria-labelledby="title"><title id="title">图 5-4 MySQL 服务层与存储引擎接口</title><rect width="900" height="396" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 5-4　MySQL 服务层与存储引擎接口</text><rect x="128" y="62" width="644" height="72" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="142" y="87" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">SQL服务层：解析与优化</text><text x="142" y="115" font-size="13" fill="#374151" text-anchor="start" font-weight="400">把语句转成内部表示与执行计划</text><path d="M450,135 L450,151" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="128" y="154" width="644" height="72" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="142" y="179" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">执行器经引擎接口访问表</text><text x="142" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">handler提供表访问操作；handlerton参与引擎级能力与事务协调</text><path d="M450,227 L450,243" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="128" y="246" width="644" height="72" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="142" y="271" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">具体引擎提供各自实现</text><text x="142" y="299" font-size="13" fill="#374151" text-anchor="start" font-weight="400">InnoDB、MyISAM、MEMORY等并不具有相同事务、索引和锁语义</text><text x="28" y="361" font-size="12" fill="#596273" text-anchor="start" font-weight="400">统一调用接口便于替换实现；能力差异仍必须由服务层和使用者处理。</text></g></svg>