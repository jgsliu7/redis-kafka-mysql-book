<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 488" role="img" aria-labelledby="title"><title id="title">图 5-1 Redis 命令处理与会话上下文</title><rect width="900" height="488" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 5-1　Redis 命令处理与会话上下文</text><rect x="128" y="62" width="644" height="72" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="142" y="87" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">读取并解析RESP字节</text><text x="142" y="115" font-size="13" fill="#374151" text-anchor="start" font-weight="400">查询缓冲保存未完成输入；解析可分多次进行</text><path d="M450,135 L450,151" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="128" y="154" width="644" height="72" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="142" y="179" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">完整参数就绪后分派与校验</text><text x="142" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">命令、参数、权限、键位置和服务器状态共同约束执行</text><path d="M450,227 L450,243" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="128" y="246" width="644" height="72" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="142" y="271" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">命令处理函数访问数据库对象</text><text x="142" y="299" font-size="13" fill="#374151" text-anchor="start" font-weight="400">client提供会话与参数上下文；类型操作在执行时读写对象</text><path d="M450,319 L450,335" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="128" y="338" width="644" height="72" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="142" y="363" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">结果进入输出缓冲并等待发送</text><text x="142" y="391" font-size="13" fill="#374151" text-anchor="start" font-weight="400">执行完成与客户端收到结果是不同事件</text><text x="28" y="453" font-size="12" fill="#596273" text-anchor="start" font-weight="400">AOF、RDB与复制有各自触发条件；不能统一画成所有命令执行后的同步存储步骤。</text></g></svg>