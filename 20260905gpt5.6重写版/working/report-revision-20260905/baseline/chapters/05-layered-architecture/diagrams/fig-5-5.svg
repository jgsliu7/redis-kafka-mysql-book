<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 488" role="img" aria-labelledby="title"><title id="title">图 5-5 Kafka 网络事件与请求处理线程</title><rect width="900" height="488" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 5-5　Kafka 网络事件与请求处理线程</text><rect x="128" y="62" width="644" height="72" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="142" y="87" font-size="14" fill="#059669" text-anchor="start" font-weight="650">Processor处理网络事件</text><text x="142" y="115" font-size="13" fill="#374151" text-anchor="start" font-weight="400">解析请求帧并建立请求对象</text><path d="M450,135 L450,151" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="128" y="154" width="644" height="72" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="142" y="179" font-size="14" fill="#059669" text-anchor="start" font-weight="650">RequestChannel有界队列</text><text x="142" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">同一进程内交接；请求队列满会形成背压，不能增加下游容量</text><path d="M450,227 L450,243" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="128" y="246" width="644" height="72" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="142" y="271" font-size="14" fill="#059669" text-anchor="start" font-weight="650">KafkaRequestHandler执行请求</text><text x="142" y="299" font-size="13" fill="#374151" text-anchor="start" font-weight="400">鉴权、配额、分派以及分区协调等工作在相应路径中进行</text><path d="M450,319 L450,335" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="128" y="338" width="644" height="72" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="142" y="363" font-size="14" fill="#059669" text-anchor="start" font-weight="650">ResponseQueue交回Processor发送</text><text x="142" y="391" font-size="13" fill="#374151" text-anchor="start" font-weight="400">响应交回网络线程；慢连接仍可能影响数据发送</text><text x="28" y="453" font-size="12" fill="#596273" text-anchor="start" font-weight="400">排队容量只能限制积压，不能增加处理能力；普通函数调用、线程交接和网络RPC要分开标注。</text></g></svg>