<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title"><title id="title">图 5-3 MySQL 会话上下文与职责边界</title><rect width="900" height="480" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 5-3　MySQL 会话上下文与职责边界</text><rect x="26.0" y="66" width="268.0" height="334" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="40.0" y="91" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">连接与会话</text><text x="40.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">连接处理先建立THD上下文</text><text x="40.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">认证结果随后写入其中</text><text x="40.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="40.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">THD关联用户、变量和当前语句</text><text x="40.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">会话状态有明确生命周期</text><text x="40.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">连接不等同于一条SQL语句</text><rect x="316.0" y="66" width="268.0" height="334" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="330.0" y="91" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">SQL处理</text><text x="330.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">解析、优化与执行</text><text x="330.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">通过上下文取得变量与事务信息</text><text x="330.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="330.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">共享THD减少重复传递</text><text x="330.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">也增加字段和生命周期的耦合</text><rect x="606.0" y="66" width="268.0" height="334" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="620.0" y="91" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">引擎访问</text><text x="620.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">handler等接口进入引擎</text><text x="620.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">使用相关事务与表状态</text><text x="620.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="620.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">共享上下文不意味着跨线程</text><text x="620.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">接口调用不意味着网络请求</text><text x="620.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">边界应按实际职责识别</text><text x="28" y="428" font-size="12" fill="#596273" text-anchor="start" font-weight="400">THD是会话执行所需的重要上下文；本图不把每个职责框映射成一个独立线程。</text></g></svg>