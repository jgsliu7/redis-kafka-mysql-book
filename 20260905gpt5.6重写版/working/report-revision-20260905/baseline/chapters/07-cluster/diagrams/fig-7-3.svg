<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 488" role="img" aria-labelledby="title"><title id="title">图 7-3 MySQL 接收、持久化与应用的职责</title><rect width="900" height="488" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 7-3　MySQL 接收、持久化与应用的职责</text><rect x="128" y="62" width="644" height="72" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="142" y="87" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">Source形成binlog事务事件</text><text x="142" y="115" font-size="13" fill="#374151" text-anchor="start" font-weight="400">事件按日志顺序保存；具体事件内容受日志格式约束</text><path d="M450,135 L450,151" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="128" y="154" width="644" height="72" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="142" y="179" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">Replica接收线程建立复制连接</text><text x="142" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">接收Source发送的事件并保存到relay log</text><path d="M450,227 L450,243" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="128" y="246" width="644" height="72" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="142" y="271" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">应用线程或协调器与多个worker处理事务</text><text x="142" y="299" font-size="13" fill="#374151" text-anchor="start" font-weight="400">接收进度和已执行进度分开；并行应用需要尊重依赖</text><path d="M450,319 L450,335" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="128" y="338" width="644" height="72" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="142" y="363" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">本地事务应用后形成可读状态</text><text x="142" y="391" font-size="13" fill="#374151" text-anchor="start" font-weight="400">候选副本收到日志不等于已应用完成</text><text x="28" y="453" font-size="12" fill="#596273" text-anchor="start" font-weight="400">多个副本仍共享Source的网络、日志保留和发送资源，不能理解成完全互不影响。</text></g></svg>