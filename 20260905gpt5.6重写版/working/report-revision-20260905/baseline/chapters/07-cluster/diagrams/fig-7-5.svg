<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title"><title id="title">图 7-5 故障检测、接管资格与业务恢复</title><rect width="900" height="480" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 7-5　故障检测、接管资格与业务恢复</text><rect x="26.0" y="66" width="268.0" height="334" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="40.0" y="91" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">Redis Cluster</text><text x="40.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">故障探测形成节点判断</text><text x="40.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">主节点间传播失败信息</text><text x="40.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">满足选举条件的副本请求授权</text><text x="40.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">新主更新槽责任与拓扑</text><text x="40.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="40.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">复制延迟与网络分区</text><text x="40.0" y="251" font-size="13" fill="#374151" text-anchor="start" font-weight="400">仍可能导致已接受写入丢失</text><rect x="316.0" y="66" width="268.0" height="334" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="330.0" y="91" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">MySQL Group Replication</text><text x="330.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">成员检测与成员视图变化</text><text x="330.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">事务有序传递与认证</text><text x="330.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">按模式和配置建立新写入角色</text><text x="330.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">客户端重新建立可用连接</text><text x="330.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="330.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">成员资格、应用进度和读等待</text><text x="330.0" y="251" font-size="13" fill="#374151" text-anchor="start" font-weight="400">不是一个相同的状态</text><rect x="606.0" y="66" width="268.0" height="334" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="620.0" y="91" font-size="14" fill="#059669" text-anchor="start" font-weight="650">Kafka 3.9.0 KRaft</text><text x="620.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">控制面检测Broker状态</text><text x="620.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">按分区副本状态选择Leader</text><text x="620.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">更新元数据并由客户端刷新</text><text x="620.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">副本按epoch对齐历史</text><text x="620.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="620.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">没有合适副本时可等待</text><text x="620.0" y="251" font-size="13" fill="#374151" text-anchor="start" font-weight="400">unclean选举另有数据丢失风险</text><text x="28" y="428" font-size="12" fill="#596273" text-anchor="start" font-weight="400">探测失联不等于证明进程已停止。角色选择、历史保护和客户端恢复各有条件。</text></g></svg>