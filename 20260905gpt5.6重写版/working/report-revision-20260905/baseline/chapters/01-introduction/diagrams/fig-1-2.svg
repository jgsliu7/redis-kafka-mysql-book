<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title"><title id="title">图 1-2 比较软件前先确定条件</title><rect width="900" height="480" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 1-2　比较软件前先确定条件</text><rect x="26.0" y="66" width="268.0" height="334" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="40.0" y="91" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">访问接口</text><text x="40.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">访问的对象是什么？</text><text x="40.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">一次操作能表达什么关系？</text><text x="40.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">哪些条件需要应用补足？</text><text x="40.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="40.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">例：键操作、SQL事务、分区追加</text><rect x="316.0" y="66" width="268.0" height="334" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="330.0" y="91" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">确认语义</text><text x="330.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">哪个节点发回成功？</text><text x="330.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">确认接收、应用还是刷盘？</text><text x="330.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">切换后允许保留什么历史？</text><text x="330.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="330.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">不同确认点不能合成一个分数</text><rect x="606.0" y="66" width="268.0" height="334" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="620.0" y="91" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">容量与恢复边界</text><text x="620.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">数据、连接和积压由谁容纳？</text><text x="620.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">多长历史可用于恢复？</text><text x="620.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">恢复期间还剩多少服务能力？</text><text x="620.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="620.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">规模与故障条件需同时给出</text><text x="28" y="428" font-size="12" fill="#596273" text-anchor="start" font-weight="400">在同一工作负载与确认条件下比较；产品名称本身不提供性能或一致性排名。</text></g></svg>