<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title"><title id="title">图 3-3 Redis正常关闭的条件与失败出口</title><rect width="900" height="500" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 3-3　Redis正常关闭的条件与失败出口</text><rect x="221" y="63" width="458" height="89" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="235" y="88" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">关闭请求或可处理信号</text><text x="235" y="116" font-size="13" fill="#374151" text-anchor="start" font-weight="400">根据当前状态与选项进入关闭处理</text><rect x="28" y="218" width="408" height="107" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="42" y="243" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">处理所承担的责任</text><text x="42" y="271" font-size="13" fill="#374151" text-anchor="start" font-weight="400">有限副本等待、AOF处理</text><text x="42" y="293" font-size="13" fill="#374151" text-anchor="start" font-weight="400">SAVE / NOSAVE选择本次RDB保存</text><rect x="498" y="218" width="374" height="107" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/><text x="512" y="243" font-size="14" fill="#DC2626" text-anchor="start" font-weight="650">无法满足退出条件</text><text x="512" y="271" font-size="13" fill="#374151" text-anchor="start" font-weight="400">保存失败或初次AOF重写尚不安全</text><text x="512" y="293" font-size="13" fill="#374151" text-anchor="start" font-weight="400">正常关闭可能报错并保持运行</text><rect x="28" y="374" width="408" height="78" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="42" y="399" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">条件满足后退出</text><text x="42" y="427" font-size="13" fill="#374151" text-anchor="start" font-weight="400">清理连接、资源与进程状态</text><path d="M336,156 L230,214" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M440,269 L494,269" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M230,329 L230,370" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><text x="28" y="482" font-size="12" fill="#596273" text-anchor="start" font-weight="400">FORCE等选项改变失败处理；NOSAVE只控制RDB，不自动取消AOF责任。</text></g></svg>