<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title"><title id="title">图 3-1 启动、服务与退出的状态关系</title><rect width="900" height="560" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 3-1　启动、服务与退出的状态关系</text><rect x="238" y="63" width="424" height="84" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="252" y="88" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">启动：建立必要条件</text><text x="252" y="116" font-size="13" fill="#374151" text-anchor="start" font-weight="400">加载配置、创建资源、恢复状态并确认角色资格</text><rect x="238" y="186" width="424" height="84" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="252" y="211" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">可服务：承接已定义的请求</text><text x="252" y="239" font-size="13" fill="#374151" text-anchor="start" font-weight="400">监听端口存在不等于业务已经就绪</text><rect x="28" y="320" width="404" height="87" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="42" y="345" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">正常退出</text><text x="42" y="373" font-size="13" fill="#374151" text-anchor="start" font-weight="400">停止接单；按策略处理已有工作与持久化责任</text><rect x="472" y="320" width="400" height="87" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/><text x="486" y="345" font-size="14" fill="#DC2626" text-anchor="start" font-weight="650">异常退出</text><text x="486" y="373" font-size="13" fill="#374151" text-anchor="start" font-weight="400">崩溃、强制终止等可跳过正常关闭处理</text><rect x="238" y="461" width="424" height="71" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="252" y="486" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">重新启动与恢复</text><text x="252" y="514" font-size="13" fill="#374151" text-anchor="start" font-weight="400">根据保留下来的文件和集群状态重新恢复</text><path d="M450,151 L450,182" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M338,274 L230,316" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M562,274 L672,316" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M230,411 L338,457" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M672,411 L562,457" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/></g></svg>