<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title"><title id="title">图 10-2 库存方案的候选与升级条件</title><rect width="900" height="480" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 10-2　库存方案的候选与升级条件</text><rect x="26.0" y="66" width="268.0" height="334" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="40.0" y="91" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">起点：MySQL直接事务</text><text x="40.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">库存行与请求结果同事务</text><text x="40.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">条件UPDATE守住非负关系</text><text x="40.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">唯一键与状态处理重复请求</text><text x="40.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="40.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">用热点分布、锁等待和延迟</text><text x="40.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">验证能否满足设定目标</text><rect x="316.0" y="66" width="268.0" height="334" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="330.0" y="91" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">受测量证据约束的改变</text><text x="330.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">热点约束未满足</text><text x="330.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">才比较限流、数据分区或串行化</text><text x="330.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="330.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">Redis前置过滤新增补偿和重建</text><text x="330.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">Kafka常态排队需约定等待目标</text><text x="330.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">不能只依据产品吞吐标签升级</text><rect x="606.0" y="66" width="268.0" height="334" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/><text x="620.0" y="91" font-size="14" fill="#059669" text-anchor="start" font-weight="650">本例保留的边界</text><text x="620.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">Redis用于派生展示</text><text x="620.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">不能独立决定预留成功</text><text x="620.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="620.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">Kafka传播已提交业务事件</text><text x="620.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">不替代本例库存数据库事务</text><text x="620.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="620.0" y="251" font-size="13" fill="#374151" text-anchor="start" font-weight="400">故障时允许暂停新的预留</text><text x="28" y="428" font-size="12" fill="#596273" text-anchor="start" font-weight="400">候选淘汰理由随业务条件变化；本章方案不声称适合所有交易系统。</text></g></svg>