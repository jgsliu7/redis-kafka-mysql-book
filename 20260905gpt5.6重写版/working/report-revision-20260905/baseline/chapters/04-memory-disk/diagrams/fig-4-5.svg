<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" role="img" aria-labelledby="title"><title id="title">图 4-5 InnoDB提交与数据页写回</title><rect width="900" height="530" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 4-5　InnoDB提交与数据页写回</text><rect x="204" y="64" width="492" height="83" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="218" y="89" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">事务修改内存页并产生redo</text><text x="218" y="117" font-size="13" fill="#374151" text-anchor="start" font-weight="400">内存页成为脏页；修改内存不要求先fsync</text><rect x="28" y="218" width="390" height="108" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="42" y="243" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">提交路径：满足相应日志条件</text><text x="42" y="271" font-size="13" fill="#374151" text-anchor="start" font-weight="400">按提交配置处理redo与binlog</text><text x="42" y="293" font-size="13" fill="#374151" text-anchor="start" font-weight="400">各事务可以通过组提交共享同步工作</text><rect x="482" y="218" width="390" height="108" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="496" y="243" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">脏页路径：满足WAL约束</text><text x="496" y="271" font-size="13" fill="#374151" text-anchor="start" font-weight="400">对应修改的redo先持久化</text><text x="496" y="293" font-size="13" fill="#374151" text-anchor="start" font-weight="400">才能把脏页写入持久数据文件</text><rect x="28" y="379" width="390" height="79" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="42" y="404" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">提交完成后返回结果</text><text x="42" y="432" font-size="13" fill="#374151" text-anchor="start" font-weight="400">响应丢失仍会产生客户端未知结果</text><rect x="482" y="379" width="390" height="79" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="496" y="404" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">经适用双写机制写入表空间</text><text x="496" y="432" font-size="13" fill="#374151" text-anchor="start" font-weight="400">未提交事务修改过的页也可以写回</text><path d="M340,150 L223,214" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M560,150 L677,214" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M223,329 L223,375" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M677,329 L677,375" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><text x="28" y="494" font-size="12" fill="#596273" text-anchor="start" font-weight="400">两条路径不以对方完成为统一前提；WAL约束日志与页的持久化次序，undo处理需要撤销的事务修改。</text></g></svg>