<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title"><title id="title">图 4-3 Redis内存状态与持久化路径</title><rect width="900" height="480" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 4-3　Redis内存状态与持久化路径</text><rect x="26.0" y="66" width="268.0" height="334" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="40.0" y="91" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">在线命令执行</text><text x="40.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">命令修改内存对象</text><text x="40.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">回复、复制传播与持久化各有路径</text><text x="40.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="40.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">fork期间存在写时复制成本</text><text x="40.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">进程创建本身也可能暂停服务</text><rect x="316.0" y="66" width="268.0" height="334" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="330.0" y="91" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">RDB快照</text><text x="330.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">按触发条件保存时点状态</text><text x="330.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">通常由子进程生成文件</text><text x="330.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="330.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">快照之后的新修改不在该快照中</text><text x="330.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">恢复从选定快照重新装载数据</text><rect x="606.0" y="66" width="268.0" height="334" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="620.0" y="91" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">AOF记录与重写</text><text x="620.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">传播命令进入AOF记录路径</text><text x="620.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">写文件与fsync由策略安排</text><text x="620.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="620.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">7.x用manifest管理base与incr</text><text x="620.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">base可为RDB或AOF</text><text x="620.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">重写从当前状态缩减恢复输入</text><text x="28" y="428" font-size="12" fill="#596273" text-anchor="start" font-weight="400">RDB和AOF不是每条命令必须串行执行的两步；确认与故障后保留范围取决于具体策略。</text></g></svg>