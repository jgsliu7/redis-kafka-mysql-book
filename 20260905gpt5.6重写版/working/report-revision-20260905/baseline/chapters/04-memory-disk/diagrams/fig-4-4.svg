<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title"><title id="title">图 4-4 InnoDB缓冲池的页管理关系</title><rect width="900" height="480" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 4-4　InnoDB缓冲池的页管理关系</text><rect x="26.0" y="66" width="268.0" height="334" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="40.0" y="91" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">Free List</text><text x="40.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">管理可分配的空闲页框</text><text x="40.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">新页进入缓冲池需要取得页框</text><text x="40.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="40.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">可用页不足时涉及淘汰与刷页</text><text x="40.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">有页框不等于目标页已缓存</text><rect x="316.0" y="66" width="268.0" height="334" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="330.0" y="91" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">LRU List</text><text x="330.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">管理已缓存页的保留与淘汰</text><text x="330.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">新读入页通常从老区进入</text><text x="330.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="330.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">默认老区比例约37%</text><text x="330.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">时间与访问条件影响提升</text><text x="330.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">扫描仍可能影响正常工作集</text><rect x="606.0" y="66" width="268.0" height="334" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/><text x="620.0" y="91" font-size="14" fill="#D97706" text-anchor="start" font-weight="650">Flush List</text><text x="620.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">管理待刷出的脏页</text><text x="620.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">与最早修改LSN等状态关联</text><text x="620.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="620.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">脏页可同时位于LRU与Flush中</text><text x="620.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">刷页后仍可留在缓冲池</text><text x="620.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">写出顺序不等于磁盘连续地址</text><text x="28" y="428" font-size="12" fill="#596273" text-anchor="start" font-weight="400">三条链表描述管理关系，不是把缓冲池切成三个互不相交的内存分区。</text></g></svg>