<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title"><title id="title">图 6-3 Redis 身份与操作权限检查</title><rect width="900" height="480" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 6-3　Redis 身份与操作权限检查</text><rect x="26.0" y="66" width="268.0" height="334" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="40.0" y="91" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">会话身份</text><text x="40.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">AUTH绑定到book_demo用户</text><text x="40.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">认证连接并非授权全部命令</text><text x="40.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="40.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">示例规则：</text><text x="40.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">+get +set</text><text x="40.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">~book:demo:*</text><rect x="316.0" y="66" width="268.0" height="334" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="330.0" y="91" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">允许的示例</text><text x="330.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">GET book:demo:item</text><text x="330.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">命令GET已授权</text><text x="330.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400">键匹配book:demo:*</text><text x="330.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="330.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">SET book:demo:item value</text><text x="330.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400">仍需同时满足命令与键范围</text><rect x="606.0" y="66" width="268.0" height="334" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/><text x="620.0" y="91" font-size="14" fill="#4F46E5" text-anchor="start" font-weight="650">拒绝与单独边界</text><text x="620.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">GET private:item</text><text x="620.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">键范围不匹配</text><text x="620.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="620.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">FLUSHALL</text><text x="620.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">未授予该命令权限</text><text x="620.0" y="229" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="620.0" y="251" font-size="13" fill="#374151" text-anchor="start" font-weight="400">Pub/Sub频道范围另行配置</text><text x="28" y="428" font-size="12" fill="#596273" text-anchor="start" font-weight="400">ACL LOG记录特定拒绝事件；它不是所有成功命令及业务效果的完整审计账本。</text></g></svg>