<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title"><title id="title">图 6-1 一次请求涉及的安全责任</title><rect width="900" height="480" fill="white"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="32" font-size="18" fill="#1F2937" text-anchor="start" font-weight="650">图 6-1　一次请求涉及的安全责任</text><rect x="26.0" y="66" width="268.0" height="334" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="40.0" y="91" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">认证与授权</text><text x="40.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">认证：连接或请求对应哪个身份</text><text x="40.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">授权：该身份可执行哪些操作</text><text x="40.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="40.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">身份映射与代理转发也有边界</text><text x="40.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">认证成功不代表任意操作可执行</text><rect x="316.0" y="66" width="268.0" height="334" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="330.0" y="91" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">加密</text><text x="330.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">传输加密保护特定连接段</text><text x="330.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">存储加密保护特定持久数据</text><text x="330.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="330.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">端点校验、证书和密钥管理</text><text x="330.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">决定加密覆盖的实际范围</text><rect x="606.0" y="66" width="268.0" height="334" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="620.0" y="91" font-size="14" fill="#6B7280" text-anchor="start" font-weight="650">审计</text><text x="620.0" y="119" font-size="13" fill="#374151" text-anchor="start" font-weight="400">记录选定的请求、决定或结果</text><text x="620.0" y="141" font-size="13" fill="#374151" text-anchor="start" font-weight="400">明确记录点、保存期和权限</text><text x="620.0" y="163" font-size="13" fill="#374151" text-anchor="start" font-weight="400"></text><text x="620.0" y="185" font-size="13" fill="#374151" text-anchor="start" font-weight="400">拒绝日志不等于完整业务审计</text><text x="620.0" y="207" font-size="13" fill="#374151" text-anchor="start" font-weight="400">记录成功不等于外部效果完成</text><text x="28" y="428" font-size="12" fill="#596273" text-anchor="start" font-weight="400">这些是可交叉的责任，不是一条按认证、授权、加密、审计固定串行执行的流水线。</text></g></svg>