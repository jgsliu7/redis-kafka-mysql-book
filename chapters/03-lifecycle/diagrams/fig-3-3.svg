<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 52 880 608" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
  </defs>


  <!-- Trigger box -->
  <rect x="300" y="64" width="280" height="70" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="440" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">关闭触发</text>
  <text x="316" y="116" font-size="12" fill="#374151">SHUTDOWN 命令 · SIGTERM/SIGINT</text>

  <!-- arrow down -->
  <path d="M440 138 L440 162" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 1: 清理重写子进程 -->
  <rect x="300" y="166" width="280" height="76" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="440" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">① RDB / AOF 重写子进程在跑？</text>
  <text x="316" y="214" font-size="12" fill="#374151">是 → 直接杀掉，不等它完成</text>
  <text x="316" y="232" font-size="12" fill="#374151">否 → 直接进入下一步</text>

  <!-- arrow down to step 2 -->
  <path d="M440 246 L440 270" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: 刷 AOF 缓冲（flush + fsync） -->
  <rect x="300" y="274" width="280" height="60" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="440" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">② 刷 AOF 缓冲（若 AOF 开启）</text>
  <text x="316" y="322" font-size="12" fill="#374151">把内存里尚未落盘的追加命令 flush 并 fsync</text>

  <!-- branch arrows from step 2 -->
  <path d="M380 338 C 320 346, 280 348, 280 352 L 280 364" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M500 338 C 560 346, 600 348, 600 352 L 600 364" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3a / 3b: RDB 落盘与否由用户决定 -->
  <rect x="160" y="366" width="240" height="86" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="280" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">③a SHUTDOWN SAVE</text>
  <text x="176" y="414" font-size="12" fill="#374151">触发阻塞式 SAVE 落盘</text>
  <text x="176" y="432" font-size="12" fill="#374151">适用：Redis 当主存用</text>

  <rect x="480" y="366" width="240" height="86" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="600" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">③b SHUTDOWN NOSAVE</text>
  <text x="496" y="414" font-size="12" fill="#374151">跳过 RDB 落盘（AOF 开则②已刷出）</text>
  <text x="496" y="432" font-size="12" fill="#374151">适用：Redis 当缓存用（秒退）</text>

  <!-- merge arrows into step 4 -->
  <path d="M280 454 C 280 462, 380 464, 380 468 L 380 482" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M600 454 C 600 462, 500 464, 500 468 L 500 482" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: 关客户端连接 -->
  <rect x="300" y="484" width="280" height="56" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="440" y="510" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">④ 关闭所有客户端连接</text>
  <text x="316" y="530" font-size="12" fill="#374151">通知对端、释放连接资源</text>

  <path d="M440 544 L440 568" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: 释放 + exit -->
  <rect x="300" y="572" width="280" height="56" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="440" y="598" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">⑤ 释放资源 → exit()</text>
  <text x="316" y="618" font-size="12" fill="#374151">交还文件锁、内存、进程身份</text>

  <!-- Side annotation -->
  <rect x="40" y="274" width="110" height="280" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.2"/>
  <text x="95" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">关键取舍</text>
  <text x="50" y="328" font-size="12" fill="#374151">“存不存数据”</text>
  <text x="50" y="346" font-size="12" fill="#374151">决定权交给用户</text>
  <text x="50" y="384" font-size="12" fill="#374151">包容缓存 / 主存</text>
  <text x="50" y="402" font-size="12" fill="#374151">的双重定位</text>
  <text x="50" y="440" font-size="12" fill="#374151">落盘由用户显式</text>
  <text x="50" y="458" font-size="12" fill="#374151">指定并承担后果</text>
  <text x="50" y="476" font-size="12" fill="#374151">不替你假设</text>
  <text x="50" y="494" font-size="12" fill="#374151">缓存还是主存</text>

  <rect x="740" y="366" width="100" height="262" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.2"/>
  <text x="790" y="392" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">履约顺序</text>
  <text x="752" y="420" font-size="12" fill="#374151">先清子进程</text>
  <text x="752" y="448" font-size="12" fill="#374151">刷缓冲</text>
  <text x="752" y="476" font-size="12" fill="#374151">再决定落盘</text>
  <text x="752" y="504" font-size="12" fill="#374151">关连接</text>
  <text x="752" y="532" font-size="12" fill="#374151">释放退出</text>
  <text x="752" y="568" font-size="12" fill="#EF4444">数据先于</text>
  <text x="752" y="586" font-size="12" fill="#EF4444">连接先于身份</text>
</svg>
